<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6ecd6" />
    <meta name="description" content="가게에 동전을 심고 열매를 기다리며 투자를 배우는 가족 게임. 씨앗·새싹·나무·숲 네 단계." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="씨앗 마을" />
    <title>씨앗 마을</title>
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <!-- 색연필 느낌: 선을 살짝 흔들고(cr), 면에 빗금(hatch)을 얹는다 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="cr" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2" />
        </filter>
        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
          <line x1="0" y1="0" x2="0" y2="5" stroke="#fff" stroke-width="1.6" opacity=".55" />
        </pattern>
      </defs>
    </svg>

    <div id="app"></div>
    <div id="sheet" class="sheet" hidden><div id="sheetBody" class="sheetbody"></div></div>

    <script src="data.js?v=3"></script>
    <script src="engine.js?v=3"></script>
    <script src="app.js?v=3"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
    </script>
  </body>
</html>
