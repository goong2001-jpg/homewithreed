<script>
/* 써브텍 주문앱 — 엑셀 양식 만들기(CJ·경동·대신·출하서)와 옛 엑셀 가져오기. DOM 안 씀 (dev 테스트와 같이 씀)
   양식의 열 순서·머리줄 글자는 사무실이 쓰던 엑셀 그대로다. 바꾸지 말 것. */
var OUT = (function () {
  var SP = '    ';
  function isDirect(o, def) { return !!(o.sender && o.sender !== (def && def.name)); }
  function snd(o, def) { return isDirect(o, def) ? { name: o.sender, phone: o.senderPhone || '', addr: o.senderAddr || '' } : { name: def.name, phone: def.phone, addr: def.addr }; }
  function itemStr(i) { return i.name + (i.sensor ? SP + i.sensor : '') + (i.qty === '' || i.qty == null ? '' : SP + i.qty + (i.unit || '')); }
  function itemText(o, sep) { return (o.items || []).map(itemStr).join(sep); }
  function recvName(o, def) { if (!o.recv) return o.cust || ''; if (isDirect(o, def) || !o.cust || o.recv.indexOf(o.cust) >= 0) return o.recv; return o.cust + ' ' + o.recv; }
  function boxes(o) { return o.box && o.box.length ? o.box : [{ k: '', b: 1 }]; }
  function md(ymd) { var m = String(ymd || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[1] + '월 ' + m[2] + '일' : String(ymd || ''); }
  function tsv(rows) { return rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[\t\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join('\t'); }).join('\n'); }
  function hd(a, s) { return a.map(function (v) { return { v: v, s: s }; }); }
  function bd(a, left) { return a.map(function (v, i) { return { v: v, s: left && left.indexOf(i) >= 0 ? 10 : 2 }; }); }

  /* ----- CJ대한통운 (건별출력) ----- */
  var CJ_H = ['보내는분성명', '보내는분전화번호', '보내는분기타연락처', '보내는분주소(전체, 분할)', '받는분성명', '받는분전화번호', '받는분기타연락처', '받는분주소(전체, 분할)', '품목명', '박스수량', '박스타입', '기본운임', '운임구분', '배송메세지1'];
  function cj(orders, def, date) {
    var rows = [], hist = [];
    orders.forEach(function (o) {
      var s = snd(o, def), nm = recvName(o, def), txt = itemText(o, '/\n');
      boxes(o).forEach(function (x) {
        rows.push([s.name, s.phone, '', s.addr, nm, o.phone || '', o.phone2 || '', o.addr || '', txt, x.b || 1, x.k || '', '', o.pay === '착불' ? '착불' : '신용', (o.msg ? o.msg + '/' : '') + nm]);
        hist.push([date, 'CJ', nm, txt, x.b || 1, x.k || '', '']);
      });
    });
    return { name: 'CJ택배_' + date, rows: rows, hist: hist, tsv: tsv(rows),
      sheets: [{ name: '건별출력', rows: [hd(CJ_H, 6)].concat(rows.map(function (r) { return bd(r); })), widths: [18.4, 15, 17.6, 46.5, 18.6, 18, 17.5, 48.4, 24.6, 9.1, 10, 5.6, 8.2, 14.5], freeze: 1 }] };
  }

  /* ----- 경동택배 (발송자료) ----- */
  var KD_H = ['보내는분', '보내는분 연락처', '받는분', '주소', '상세주소', '운송장번호', '고객사주문번호', '우편번호', '도착영업소', '전화번호', '기타전화번호', '선불후불', '품목명', '수량', '포장상태', '가로', '세로', '높이', '무게', '개별단가', '배송운임', '기타운임', '별도운임', '할증운임', '도서운임', '메모'];
  function kd(orders, def, date) {
    var rows = [], hist = [];
    orders.forEach(function (o) {
      var s = snd(o, def), nm = recvName(o, def), txt = itemText(o, '/'), zip = (String(o.addr || '').match(/\(?(\d{5})\)?/) || [])[1] || '';
      boxes(o).forEach(function (x) {
        rows.push([s.name, s.phone, nm, String(o.addr || '').replace(/^\(?\d{5}\)?\s*/, ''), '', '', '', zip, o.branch || '', o.phone || '', o.phone2 || '', o.pay === '착불' ? '착불' : '선불', txt, x.b || 1, '박스', 10, 10, 10, 10, 50, x.f || '', 100, '', '', '', nm]);   // 경동 메모엔 박스 크기 안 씀 (사용자 요청 11-18)
        hist.push([date, '경동', nm, txt, x.b || 1, x.k || '', x.f || '']);
      });
    });
    return { name: '경동택배_' + date, rows: rows, hist: hist, tsv: tsv(rows),
      sheets: [{ name: '발송자료', rows: [hd(KD_H, 6)].concat(rows.map(function (r) { return bd(r); })), widths: [14.2, 23.8, 27.2, 47, 12.5, 9.9, 14.9, 9, 17.1, 14.4, 13, 13, 27.9, 5.2, 9, 5.2, 5.2, 5.2, 5.2, 14.4, 14.4, 9, 9, 9, 9, 19.2], freeze: 1 }] };
  }

  /* ----- 대신화물 (날짜 탭, 발화주별 표) ----- */
  var DS_H = ['도착지', '수화주전화', '수화주명', '품명', '소/대 구분', '포장방법', '수량', '현/착불', '운임', '운송방법', '총운임'];
  function ds(orders, def, date) {
    var groups = {}, order = [], hist = [], flat = [];
    orders.forEach(function (o) { var s = snd(o, def), k = s.name + ',' + s.phone; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(o); });
    var rows = [[{ v: md(date), s: 7 }], []], merges = [], heights = { 0: 34 };
    order.forEach(function (k, gi) {
      if (gi) { rows.push([]); rows.push([]); }
      rows.push([{ v: '발화주 :' + k, s: 8 }]); heights[rows.length - 1] = 26;
      rows.push(hd(DS_H, 6));
      groups[k].forEach(function (o) {
        var nm = recvName(o, def), txt = itemText(o, '\n');
        boxes(o).forEach(function (x) {
          var b = x.b || 1, f = x.f || '', r = [o.branch || o.addr || '', o.phone || '', nm, txt, x.k || '', '박스', b, o.pay === '착불' ? '착불' : '현불', f, o.mode || '화물', f ? f * b : ''];
          flat.push(r); rows.push(r.map(function (v, i) { return { v: v, s: i === 7 ? 9 : 2 }; })); heights[rows.length - 1] = Math.max(45, 18 * (o.items || []).length + 12);
          hist.push([date, '대신', nm, txt, b, x.k || '', f]);
        });
      });
    });
    return { name: '대신화물_' + date, rows: flat, hist: hist, tsv: tsv(flat),
      sheets: [{ name: md(date), rows: rows, widths: [56.5, 19.1, 18.2, 30.6, 18.6, 13.1, 11.5, 10.6, 10.5, 11.8, 10.4], heights: heights, merges: merges, landscape: true }] };
  }

  /* ----- 출하서 (출고현황) : 위 = 그날 나간 것, 합계, 아래 = 못 나간 것(대기) ----- */
  var RP_H = ['no.', '일자-No.', '거래처명', '품목명[규격]', '센서', '수량', '적요', '받는분', '배송방법', '거래명세서', '계산서 발행 여부'];
  function qtyCell(i, isAcc) { if (i.qty === '' || i.qty == null) return ''; return (i.unit && i.unit !== '개') || isAcc(i.name) ? i.qty + (i.unit || '개') : +i.qty; }
  // 품목 적요: 품목 메모 + 일부 출고면 '주문 120 중 60 출고 (자재부족)'
  function noteOf(i) { return [i.note, i.ord && +i.ord !== +i.qty ? '주문 ' + i.ord + ' 중 ' + i.qty + ' 출고' + (i.why ? ' (' + i.why + ')' : '') : ''].filter(Boolean).join(' / '); }
  function report(snap, isAcc) {
    isAcc = isAcc || function () { return false; };
    var rows = [], merges = [[0, 0, 0, 10]], sum = [0, 0];
    rows.push(hd([snap.date.replace(/-/g, '/') + '-출고현황', '', '', '', '', '', '', '', '', '', ''], 3));
    rows.push(hd(RP_H, 1));
    // 같은 거래처 주문은 한 번호로 묶음 (예: 와이코퍼레이션 직송 여러 건 → 적요에 "직송 1 / 문 앞", 받는분·배송방법은 주문마다)
    // 대기 쪽은 거래처 + 출고 예정이 같을 때만 묶음
    function block(list, which, numbered) {
      var groups = [], at = {};
      list.forEach(function (o) { var k = String(o.cust || '').replace(/\s/g, '').toLowerCase() + (which ? '|' + (o.due || '') : ''); if (!(k in at)) { at[k] = groups.length; groups.push([]); } groups[at[k]].push(o); });
      groups.forEach(function (g, n) {
        var g0 = rows.length, multi = g.length > 1;
        g.forEach(function (o, j) {
          var its = (o.items && o.items.length ? o.items : [{ name: '', sensor: '', qty: '', unit: '', note: '' }]).map(function (i) { return Object.assign({}, i, { note: noteOf(i) }); }), r0 = rows.length, anyNote = its.some(function (i) { return i.note; });
          var mine = o.own !== false, to = mine ? [o.recv, o.phone].filter(Boolean).join(' / ') : '', recv = [to, mine ? o.addr : ''].filter(Boolean).join(' ') || (o.branch || '');   // own=false: 단골 기본 주소는 출하서에 안 씀
          var head = [multi ? ((o.sender || o.recv) ? '직송 ' : '') + (j + 1) : '', o.memo, multi ? o.msg : ''].filter(Boolean).join(' / ');
          its.forEach(function (i, k) {
            var q = qtyCell(i, isAcc); if (typeof q === 'number') sum[which] += q;
            var note = k === 0 ? [head, i.note].filter(Boolean).join(' / ') : (i.note || ''), top = j === 0 && k === 0;
            rows.push([{ v: top && numbered ? n + 1 : '', s: 2 }, { v: top ? (which ? md(o.due) : md(snap.date)) : '', s: 2 }, { v: top ? o.cust : '', s: 2 }, { v: i.name, s: 2 }, { v: i.sensor || '', s: 2 },
              { v: q, s: typeof q === 'number' ? 5 : 2 }, { v: note, s: 2 }, { v: k === 0 ? recv : '', s: 2 }, { v: k === 0 ? (o.ship || '') : '', s: 2 }, { v: top ? (o.stmt || '') : '', s: 2 }, { v: top ? (o.tax || '') : '', s: 2 }]);
          });
          if (its.length > 1) { var r1 = rows.length - 1; [7, 8].forEach(function (c) { merges.push([r0, c, r1, c]); }); if (!anyNote) merges.push([r0, 6, r1, 6]); }
        });
        var g1 = rows.length - 1; if (g1 > g0) [0, 1, 2, 9, 10].forEach(function (c) { merges.push([g0, c, g1, c]); });
      });
    }
    var dk = function (o) { return /^\d{4}-\d{2}-\d{2}$/.test(o.due || '') ? o.due : '9999' + (o.due || ''); };
    snap = Object.assign({}, snap, { pending: (snap.pending || []).slice().sort(function (a, b) { return dk(a).localeCompare(dk(b)); }) });   // 대기는 출고 예정 순서
    block(snap.shipped || [], 0, true);
    var t = rows.length; rows.push(hd(['합계', '', '', '', '', sum[0], '', '', '', '', ''], 4)); merges.push([t, 0, t, 1]);
    block(snap.pending || [], 1, false);
    t = rows.length; rows.push(hd(['출고 대기 합계', '', '', '', '', sum[1], '부자재(센서·파워코드 등) 수량 제외', '', '', '', ''], 4)); merges.push([t, 0, t, 1]);
    return { name: '출하서_' + snap.date, sum: sum, sheets: [{ name: md(snap.date), rows: rows, merges: merges, widths: [5.1, 16.5, 36.4, 23.2, 9.2, 10.4, 33.6, 35.9, 20.1, 13.8, 21.8], rowH: 30, landscape: true }] };
  }

  /* ----- 하루 마감 파일: 탭 = 출하서 · CJ · 경동 · 대신 · 직납·방문 · 미출고 (그날 나간 것 기준) ----- */
  var LIST_H = ['일자', '거래처명', '품목명[규격]', '센서', '수량', '적요', '받는분', '배송방법'];
  function listSheet(name, orders, which, isAcc) {
    var rows = [hd(LIST_H, 6)];
    orders.forEach(function (o) { var its = o.items && o.items.length ? o.items : [{ name: '', qty: '' }];
      its.forEach(function (i, k) { var q = i.qty === '' || i.qty == null ? '' : ((i.unit && i.unit !== '개') || isAcc(i.name) ? i.qty + (i.unit || '개') : +i.qty);
        rows.push(bd([k ? '' : (which === 'due' ? md(o.due) : md(o.shipped)), k ? '' : o.cust, i.name, i.sensor || '', q, [k ? '' : o.memo, noteOf(i)].filter(Boolean).join(' / '), k ? '' : [o.recv, o.phone, o.branch, o.addr].filter(Boolean).join(' '), k ? '' : (o.ship || '')], [2, 5, 6])); }); });
    return { name: name, rows: rows, widths: [11, 26, 24, 7, 9, 34, 46, 18], freeze: 1 };
  }
  function day(snap, def, isAcc) {
    isAcc = isAcc || function () { return false; };
    var sh = (snap.shipped || []), by = function (c) { return sh.filter(function (o) { return o.carrier === c; }); }, out = [];
    var r = report(snap, isAcc).sheets[0]; r.name = '출하서'; out.push(r);
    [['CJ', cj], ['경동', kd], ['대신', ds]].forEach(function (x) { var l = by(x[0]); if (!l.length) return; var t = x[1](l, def, snap.date).sheets[0]; t.name = x[0]; out.push(t); });
    var etc = sh.filter(function (o) { return ['CJ', '경동', '대신'].indexOf(o.carrier) < 0; });
    if (etc.length) out.push(listSheet('직납·방문 등', etc, 'shipped', isAcc));
    if ((snap.pending || []).length) out.push(listSheet('미출고', snap.pending, 'due', isAcc));
    var cnt = {}; sh.forEach(function (o) { var k = o.carrier || '기타'; cnt[k] = (cnt[k] || 0) + 1; });
    return { name: '하루마감_' + snap.date, sheets: out, count: cnt };
  }

  /* ----- 월 파일: 거래처별 · 품목별 · 출고목록 + 날짜별 출하서 탭 (11월.xlsx 처럼 최근 날짜가 앞) ----- */
  function month(data, isAcc) {
    isAcc = isAcc || function () { return false; };
    var list = data.shipped || [], byDay = {}, C = {}, I = {}, L = [hd(['출고일', '거래처명', '품목명[규격]', '센서', '출고 수량', '주문 수량', '사유', '배송방법', '거래명세서', '계산서 발행 여부'], 6)];
    list.slice().sort(function (a, b) { return (a.shipped + a.cust).localeCompare(b.shipped + b.cust); }).forEach(function (o) {
      (byDay[o.shipped] = byDay[o.shipped] || []).push(o);
      var c = C[o.cust] || (C[o.cust] = { n: 0, q: 0, acc: 0, stmt: {}, tax: {}, days: {} }); c.n++; c.days[o.shipped] = 1; if (o.stmt) c.stmt[o.stmt] = 1; if (o.tax) c.tax[o.tax] = 1;
      (o.items || []).forEach(function (i) { var q = +i.qty || 0, acc = isAcc(i.name) || (i.unit && i.unit !== '개');
        if (acc) c.acc += q; else c.q += q;
        var k = String(i.name).toLowerCase().replace(/\s+/g, '') + '|' + (i.sensor || ''), it = I[k] || (I[k] = { name: i.name, sensor: i.sensor || '', q: 0, n: 0, unit: acc ? (i.unit || '개') : '' }); it.q += q; it.n++;
        L.push(bd([md(o.shipped), o.cust, i.name, i.sensor || '', q, i.ord || '', i.why || '', o.ship || '', o.stmt || '', o.tax || ''])); });
    });
    var cs = Object.keys(C).sort(), cr = [hd(['거래처명', '출고 건수', '출고일 수', '제품 수량', '부자재 수량', '거래명세서', '계산서 발행 여부'], 6)], tq = 0, ta = 0, tn = 0;
    cs.forEach(function (k) { var c = C[k]; tq += c.q; ta += c.acc; tn += c.n; cr.push(bd([k, c.n, Object.keys(c.days).length, c.q, c.acc, Object.keys(c.stmt).join(', '), Object.keys(c.tax).join(', ')], [0])); });
    cr.push(hd(['합계', tn, '', tq, ta, '', ''], 4));
    var ir = [hd(['품목명[규격]', '센서', '출고 수량', '단위', '출고 횟수'], 6)];
    Object.keys(I).map(function (k) { return I[k]; }).sort(function (a, b) { return b.q - a.q; }).forEach(function (x) { ir.push(bd([x.name, x.sensor, x.q, x.unit || '', x.n], [0])); });
    var ym = data.month.split('-'), title = +ym[1] + '월';
    var sheets = [{ name: '거래처별', rows: cr, widths: [30, 10, 10, 12, 12, 12, 18], freeze: 1 }, { name: '품목별', rows: ir, widths: [30, 8, 12, 8, 10], freeze: 1 }, { name: '출고목록', rows: L, widths: [11, 26, 24, 7, 10, 10, 14, 18, 11, 16], freeze: 1 }];
    var days = Object.keys(byDay).concat(Object.keys(data.pending || {})).filter(function (d, i, a) { return a.indexOf(d) === i; }).sort().reverse();
    days.forEach(function (d) { var r = report({ date: d, shipped: byDay[d] || [], pending: (data.pending || {})[d] || [] }, isAcc).sheets[0]; sheets.push(r); });
    return { name: ym[0] + '년 ' + (+ym[1]) + '월_출고현황', title: title, sheets: sheets, days: days.length, orders: list.length };
  }

  /* ----- 옛 엑셀 가져오기: XL.read 결과 → {custs, hist, what} ----- */
  function cl(v) { return String(v == null ? '' : v).replace(/\r/g, '').replace(/^\s+|\s+$/g, ''); }
  function dateLabel(v) { if (typeof v === 'number' && v > 40000 && v < 60000) return XL.date(v); var s = cl(v); return /^\d{1,2}월\s*\d{1,2}일$/.test(s) ? s : ''; }
  function importBook(R, def) {
    var custs = [], hist = [], what = [], defName = (def && def.name) || '써브텍';
    var book = R['매출처 주소록'], cjLog = R['송장출력건'], kdLog = R['발송기록'];
    if (book) {
      book.slice(3).forEach(function (r) { var nm = cl(r[1]), ad = cl(r[4]), m; if (!nm) return;
        if ((m = ad.match(/^(경동|대신)\s*(?:택배|화물)?\s*[:：]\s*(.+)$/))) { var c = { name: nm }; c[m[1] === '경동' ? 'kd' : 'ds'] = cl(m[2]); custs.push(c); return; }
        custs.push({ name: nm, phone: cl(r[2]), phone2: cl(r[3]), addr: ad }); });
      what.push('CJ 매출처 주소록');
    }
    if (cjLog) {
      var d = ''; cjLog.forEach(function (r) { var dl = dateLabel(r[0]); if (dl && !r[4]) { d = dl; return; }
        if (r[4] && r[7] && r[8] && cl(r[4]) !== '받는분성명') hist.push([d, 'CJ', cl(r[4]), cl(r[8]), +r[9] || 1, cl(r[10]), '']); });
      what.push('CJ 송장출력건');
    }
    if (kdLog) {
      var d2 = ''; kdLog.slice(1).forEach(function (r) { var dl = dateLabel(r[0]); if (dl && !r[2]) { d2 = dl; return; }
        if (!r[2] || !r[12]) return; var memo = cl(r[25]), k = memo.indexOf('/') >= 0 ? cl(memo.split('/').pop()) : '', snd = cl(r[0]);
        hist.push([d2, '경동', cl(r[2]), cl(r[12]), +r[13] || 1, k, +r[20] || '']);
        if (!snd || snd === defName) custs.push({ name: cl(r[2]), addr: cl([cl(r[3]), cl(r[4])].join(' ')), phone: cl(r[9]), phone2: cl(r[10]), kd: cl(r[8]) }); });
      what.push('경동 발송기록');
    }
    var dsN = 0;
    Object.keys(R).forEach(function (name) {
      var rows = R[name], on = false, sender = '';
