<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2c3e50" />
    <meta name="description" content="전세보증금·대출·예적금·투자를 한 화면에서 보는 자산관리" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />

    <!-- iOS는 manifest의 icons를 안 보고 apple-touch-icon 만 쓴다.
         이게 없으면 '홈 화면에 추가' 시 페이지 스크린샷이 아이콘이 된다. -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="내자산" />

    <title>내 자산관리</title>
  </head>
  <body>
    <noscript>이 앱을 실행하려면 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
