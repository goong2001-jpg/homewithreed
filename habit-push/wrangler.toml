name = "habit-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 1분마다 깨어나 "지금 보낼 알림이 있나" 확인한다.
# 하루 1,440번 — 무료 한도(하루 10만 요청)에 견주면 아무것도 아니다.
# 알림 시각을 cron 에 박지 않는 이유: 부모가 앱에서 시간을 바꿔도
# Worker 를 다시 배포할 필요가 없어야 하기 때문이다.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "HABIT_KV"
id = "여기에_KV_네임스페이스_ID를_넣으세요"

[vars]
# 앱을 올려둔 주소. CORS 를 이 주소로만 열어둔다.
ALLOWED_ORIGIN = "https://goong2001-jpg.github.io"
# VAPID 공개키 (공개돼도 되는 값 — 앱 번들에도 같이 들어간다)
VAPID_PUBLIC_KEY = ""
# 푸시 서비스가 연락할 곳. mailto: 또는 https: 여야 한다
VAPID_SUBJECT = "mailto:goong2001@gmail.com"

# 아래 두 개는 절대 여기 적지 말고 시크릿으로 넣으세요:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put PASSPHRASE
