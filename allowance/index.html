<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f8ef7" />
    <meta name="description" content="구름이가 받은 용돈과 쓴 돈을 버튼 한 번으로 적고, 목표 금액까지 얼마 남았는지 보는 연도별 용돈기입장." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="구름이 용돈" />
    <link rel="stylesheet" href="style.css?v=4" />
    <title>구름이 용돈기입장</title>
  </head>
  <body>
    <noscript>이 앱을 실행하려면 JavaScript가 필요합니다.</noscript>

    <main id="app">
      <header class="top">
        <h1>☁️ 구름이 용돈기입장</h1>
      </header>

      <!-- 가진 돈 + 연도별 받은 돈·쓴 돈 -->
      <section class="card total">
        <div class="totalLabel">지금 가진 돈</div>
        <div id="balance" class="totalAmount">0원</div>
        <div class="yearNav">
          <button id="prevYear" class="navBtn" aria-label="이전 해">◀</button>
          <span id="yearLabel" class="yearLabel">2026년</span>
          <button id="nextYear" class="navBtn" aria-label="다음 해">▶</button>
        </div>
        <div class="yearStats">
          <div><div class="ysLabel">받은 돈 <small id="yearInCount">0번</small></div><div id="yearIn" class="ysNum">+0원</div></div>
          <div><div class="ysLabel">쓴 돈 <small id="yearOutCount">0번</small></div><div id="yearOut" class="ysNum">−0원</div></div>
        </div>
      </section>

      <!-- 목표 -->
      <section class="card goal">
        <div id="goalBody"></div>
      </section>

      <!-- 기록하기 -->
      <section id="recordCard" class="card">
        <div class="seg" role="tablist">
          <button data-mode="in" class="on">받았어요 💰</button>
          <button data-mode="out">썼어요 🛍️</button>
        </div>
        <h2 id="recordTitle">용돈 받았어요! 💰</h2>

        <div class="fieldRow">
          <label id="dateLabel" for="dateInput">받은 날</label>
          <input id="dateInput" type="date" />
        </div>

        <div class="fieldLabel"><span id="tagLabel">누가 줬어요?</span> <small>(안 골라도 돼요)</small></div>
        <div id="tags" class="chips"></div>

        <div class="bills">
          <button class="bill b1000" data-amount="1000"><span class="billNum">1,000</span><span class="billWon">천원</span></button>
          <button class="bill b5000" data-amount="5000"><span class="billNum">5,000</span><span class="billWon">오천원</span></button>
          <button class="bill b10000" data-amount="10000"><span class="billNum">10,000</span><span class="billWon">만원</span></button>
          <button class="bill b50000" data-amount="50000"><span class="billNum">50,000</span><span class="billWon">오만원</span></button>
        </div>
        <button id="customBtn" class="customBtn">✏️ 금액 직접 입력 (예: 1,500원)</button>
        <p class="hint">버튼을 누르면 바로 적혀요. 잘못 눌렀으면 아래 알림에서 <b>되돌리기</b>.</p>
      </section>

      <!-- 올해 요약 -->
      <section class="card">
        <h2 id="summaryTitle">2026년 요약</h2>
        <div class="subHead">받은 지폐</div>
        <div id="billCounts" class="billCounts"></div>
        <div class="subHead">월별 <span class="legend"><i class="lgIn"></i>받은 돈 <i class="lgOut"></i>쓴 돈</span></div>
        <div id="months" class="months"></div>
        <div id="useBreak"></div>
      </section>

      <!-- 기록 목록 -->
      <section class="card">
        <h2 id="listTitle">2026년 기록</h2>
        <div id="list"></div>
      </section>

      <!-- 백업 -->
      <details class="card backup">
        <summary>백업 · 옮기기</summary>
        <p class="hint">기록은 이 폰 브라우저에만 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 백업 파일을 저장해 두세요.</p>
        <div class="backupBtns">
          <button id="exportBtn" class="ghost">백업 파일 저장</button>
          <label class="ghost fileBtn">백업 불러오기<input id="importInput" type="file" accept="application/json,.json" hidden /></label>
        </div>
        <p id="lastBackup" class="hint"></p>
      </details>
    </main>

    <div id="toast" class="toast hidden" role="status">
      <span id="toastText"></span>
      <button id="undoBtn" class="undo">되돌리기</button>
    </div>

    <!-- 앱이 안 뜨면(옛 파일이 캐시에 남아 버전이 섞였을 때) 새로 받기 버튼을 보여준다 -->
    <div id="bootFail" class="bootFail" hidden>
      화면이 제대로 안 보이나요?
      <button id="hardReload">새로 받기</button>
    </div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__allowanceReady) return;
          var box = document.getElementById('bootFail');
          box.hidden = false;
          document.getElementById('hardReload').onclick = function () {
            var jobs = [];
            if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
            Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
          };
        }, 1500);
      });
    </script>
    <script src="app.js?v=4"></script>
  </body>
</html>
