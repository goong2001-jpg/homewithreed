<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#12161c" />
    <meta name="description" content="폰 마이크와 스피커로 가족끼리 쓰는 무전기. 채널 번호만 맞추면 바로 통화됩니다." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="style.css" />
    <title>집무전기</title>
  </head>
  <body>
    <noscript>이 앱을 실행하려면 JavaScript가 필요합니다.</noscript>

    <main id="app">
      <!-- 1. 채널 입장 -->
      <section id="joinView" class="view">
        <h1 class="logo">📻 집무전기</h1>
        <p class="sub">같은 채널 번호를 넣은 사람끼리 무전이 됩니다.<br />최대 6명.</p>

        <label class="field">
          <span>내 이름</span>
          <input id="nameInput" type="text" inputmode="text" maxlength="8" placeholder="아빠" autocomplete="nickname" />
        </label>

        <label class="field">
          <span>채널 번호 (4자리)</span>
          <input id="roomInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" />
        </label>

        <button id="joinBtn" class="primary">채널 열기</button>
        <p id="joinMsg" class="msg"></p>

        <details class="tips">
          <summary>잘 안 될 때</summary>
          <ul>
            <li>마이크 권한을 허용해야 합니다.</li>
            <li>아이폰은 홈 화면에 추가한 뒤 열면 더 안정적입니다.</li>
            <li>화면을 끄거나 다른 앱으로 나가면 무전이 끊깁니다. 브라우저 앱을 열어둔 상태로 쓰세요.</li>
            <li>같은 방에서 두 대를 쓰면 하울링이 납니다. 한 대는 이어폰을 쓰거나 떨어뜨려 두세요.</li>
          </ul>
        </details>
      </section>

      <!-- 2. 무전 화면 -->
      <section id="talkView" class="view hidden">
        <header class="bar">
          <div>
            <div class="ch">CH <b id="chLabel">0000</b></div>
            <div id="statusLine" class="status">연결 중…</div>
          </div>
          <button id="leaveBtn" class="ghost">나가기</button>
        </header>

        <ul id="members" class="members"></ul>

        <div id="nowTalking" class="nowTalking">&nbsp;</div>

        <button id="pttBtn" class="ptt">
          <span class="pttIcon">🎙</span>
          <span class="pttText">누르고 말하기</span>
        </button>

        <div class="row">
          <label class="toggle">
            <input id="lockToggle" type="checkbox" />
            <span>손 떼도 계속 송신 (핸즈프리)</span>
          </label>
          <label class="toggle">
            <input id="duplexToggle" type="checkbox" checked />
            <span>말하는 동안 상대 소리 줄이기 (하울링 방지)</span>
          </label>
        </div>

        <p class="hint">스페이스바로도 송신됩니다. 화면은 자동으로 꺼지지 않습니다.</p>
      </section>
    </main>

    <div id="audioSink" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
