name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/intelligent-cannon-txjx76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build kumon-math
        working-directory: kumon-math
        run: |
          npm ci
          npm run build

      - name: Build receipt-tracker
        working-directory: receipt-tracker
        run: |
          npm ci
          npm run build

      - name: Build safety-exam
        working-directory: safety-exam
        run: |
          npm ci
          npm run build

      - name: Build couple-budget
        working-directory: couple-budget
        run: |
          npm ci
          npm run build

      - name: Build asset-tracker
        working-directory: asset-tracker
        run: |
          npm ci
          npm run build

      - name: Build time-tracker
        working-directory: time-tracker
        run: |
          npm ci
          npm run build

      - name: Build chinese-learn
        working-directory: chinese-learn
        run: |
          npm ci
          npm run build

      - name: Build habit-talk
        working-directory: habit-talk
        # 푸시 서버 주소는 public/push-config.json 에 들어 있어서
        # 빌드 시점에 넣어줄 값이 없다.
        run: |
          npm ci
          npm run build

      - name: Build family-meal
        working-directory: family-meal
        run: |
          npm ci
          npm run build

      - name: Combine builds
        run: |
          mkdir -p site
          cp -r kumon-math/build/. site/
          mkdir -p site/receipt-tracker
          cp -r receipt-tracker/build/. site/receipt-tracker/
          mkdir -p site/safety-exam
          cp -r safety-exam/build/. site/safety-exam/
          mkdir -p site/couple-budget
          cp -r couple-budget/build/. site/couple-budget/
          mkdir -p site/asset-tracker
          cp -r asset-tracker/build/. site/asset-tracker/
          mkdir -p site/time-tracker
          cp -r time-tracker/build/. site/time-tracker/
          mkdir -p site/chinese-learn
          cp -r chinese-learn/build/. site/chinese-learn/
          mkdir -p site/habit-talk
          cp -r habit-talk/build/. site/habit-talk/
          mkdir -p site/family-meal
          cp -r family-meal/build/. site/family-meal/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
