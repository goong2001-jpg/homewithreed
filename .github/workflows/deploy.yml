name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/intelligent-cannon-txjx76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build kumon-math
        working-directory: kumon-math
        run: |
          npm ci
          npm run build

      - name: Build receipt-tracker
        working-directory: receipt-tracker
        run: |
          npm ci
          npm run build

      - name: Combine builds
        run: |
          mkdir -p site
          cp -r kumon-math/build/. site/
          mkdir -p site/receipt-tracker
          cp -r receipt-tracker/build/. site/receipt-tracker/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
