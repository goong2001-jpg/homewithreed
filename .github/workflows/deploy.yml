name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/intelligent-cannon-txjx76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 테스트(ci.yml)를 먼저 통과해야 빌드·배포로 넘어간다.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # couple-budget/version.json 이 앱을 마지막으로 바꾼 커밋을 찾으려면 이력이 필요하다
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build kumon-math
        working-directory: kumon-math
        run: |
          npm ci
          npm run build

      - name: Build receipt-tracker
        working-directory: receipt-tracker
        run: |
          npm ci
          npm run build

      - name: Build safety-exam
        working-directory: safety-exam
        run: |
          npm ci
          npm run build

      - name: Build couple-budget
        working-directory: couple-budget
        run: |
          npm ci
          npm run build

      # 배포된 가계부가 어느 버전인지 .../couple-budget/version.json 으로 확인할 수 있게 한다.
      # 앱 코드가 아니라 결과물 폴더에 파일 하나를 더할 뿐이고, 실패해도 배포는 계속한다.
      - name: couple-budget version.json
        continue-on-error: true
        run: node couple-budget/dev/version-json.mjs --out couple-budget/build/version.json

      - name: Build asset-tracker
        working-directory: asset-tracker
        run: |
          npm ci
          npm run build

      - name: Build time-tracker
        working-directory: time-tracker
        run: |
          npm ci
          npm run build

      - name: Build chinese-learn
        working-directory: chinese-learn
        run: |
          npm ci
          npm run build

      - name: Build habit-talk
        working-directory: habit-talk
        # 푸시 서버 주소는 public/push-config.json 에 들어 있어서
        # 빌드 시점에 넣어줄 값이 없다.
        run: |
          npm ci
          npm run build

      - name: Build family-meal
        working-directory: family-meal
        run: |
          npm ci
          npm run build

      - name: Combine builds
        run: |
          mkdir -p site
          cp -r kumon-math/build/. site/
          mkdir -p site/receipt-tracker
          cp -r receipt-tracker/build/. site/receipt-tracker/
          mkdir -p site/safety-exam
          cp -r safety-exam/build/. site/safety-exam/
          mkdir -p site/couple-budget
          cp -r couple-budget/build/. site/couple-budget/
          mkdir -p site/asset-tracker
          cp -r asset-tracker/build/. site/asset-tracker/
          mkdir -p site/time-tracker
          cp -r time-tracker/build/. site/time-tracker/
          mkdir -p site/chinese-learn
          cp -r chinese-learn/build/. site/chinese-learn/
          mkdir -p site/habit-talk
          cp -r habit-talk/build/. site/habit-talk/
          mkdir -p site/family-meal
          cp -r family-meal/build/. site/family-meal/
          # walkie-talkie 는 빌드가 없는 정적 앱이라 그대로 복사한다. 테스트 폴더는 빼고 올린다.
          mkdir -p site/walkie-talkie
          cp -r walkie-talkie/. site/walkie-talkie/
          rm -rf site/walkie-talkie/test
          # allowance(구름이 용돈기입장)도 빌드 없는 정적 앱이다. 테스트 폴더는 빼고 올린다.
          mkdir -p site/allowance
          cp -r allowance/. site/allowance/
          rm -rf site/allowance/test
          # family-bank(엄마아빠 은행)도 빌드 없는 정적 앱이다. 테스트 폴더는 빼고 올린다.
          mkdir -p site/family-bank
          cp -r family-bank/. site/family-bank/
          rm -rf site/family-bank/test
          # japanese-learn(일본어 한 걸음)도 빌드 없는 정적 앱이다. 테스트 폴더는 빼고 올린다.
          mkdir -p site/japanese-learn
          cp -r japanese-learn/. site/japanese-learn/
          rm -rf site/japanese-learn/test
          # tech-coach(기술 설명 8주)도 빌드 없는 정적 앱이다. 테스트 폴더와 코칭용 문서는 빼고 올린다.
          mkdir -p site/tech-coach
          cp -r tech-coach/. site/tech-coach/
          rm -rf site/tech-coach/test site/tech-coach/*.md
          # handwriting(바른 글씨 연습장)은 index.html 하나짜리 정적 앱이다. 문서는 빼고 올린다.
          mkdir -p site/handwriting
          cp -r handwriting/. site/handwriting/
          rm -f site/handwriting/*.md
          # hunter-town(헌터 마을)도 빌드 없는 정적 앱이다. 테스트 폴더와 문서는 빼고 올린다.
          mkdir -p site/hunter-town
          cp -r hunter-town/. site/hunter-town/
          rm -rf site/hunter-town/test site/hunter-town/*.md
          # god-village(신의 마을)도 빌드 없는 정적 앱이다. 테스트 폴더와 문서는 빼고 올린다.
          mkdir -p site/god-village
          cp -r god-village/. site/god-village/
          rm -rf site/god-village/test site/god-village/*.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # couple-budget 변경 이력을 couple-budget/CHANGELOG.md 맨 위에 자동으로 붙인다.
  # - 배포가 성공한 뒤에만 돈다 (needs: deploy)
  # - continue-on-error: 여기서 실패해도 배포 결과는 성공으로 남는다
  # - 기록 커밋은 GITHUB_TOKEN 으로 푸시하고 [skip ci] 를 달아 이 워크플로를 다시 돌리지 않는다
  # - 같은 커밋은 한 번만 기록한다(<!-- sha:… --> 표시). 실패·취소로 빠진 것은 다음 배포 때 따라잡는다
  # - 다른 앱만 바뀐 배포에서는 기록할 게 없어서 아무것도 하지 않는다
  couple-budget-changelog:
    needs: deploy
    if: github.ref == 'refs/heads/claude/intelligent-cannon-txjx76'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CHANGELOG.md 에 이번 배포 기록
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: bash couple-budget/dev/record-changelog.sh

      - name: 배포된 version.json 확인
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}/couple-budget/version.json"
          for i in $(seq 1 12); do
            if curl -fsS "$url?t=$(date +%s)" -o version.json \
               && grep -q "\"deployedCommit\": \"$GITHUB_SHA\"" version.json; then
              echo "배포 확인됨: $url"; cat version.json; exit 0
            fi
            sleep 10
          done
          echo "::warning::version.json 이 아직 이번 커밋을 가리키지 않습니다 ($url)"
          cat version.json 2>/dev/null || true
          exit 1
