name: CI

# PR 과 모든 브랜치 push 에서 테스트를 돌린다.
# deploy.yml 이 workflow_call 로 이 워크플로를 먼저 통과시킨 뒤 빌드·배포한다.
on:
  pull_request:
  push:
    branches-ignore:
      - claude/intelligent-cannon-txjx76   # 배포 워크플로가 workflow_call 로 대신 호출한다
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # React(CRA) 앱: 단위 테스트 + 빌드
  react:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - asset-tracker
          - chinese-learn
          - couple-budget
          - family-meal
          - habit-talk
          - kumon-math
          - receipt-tracker
          - safety-exam
          - time-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Test
        working-directory: ${{ matrix.app }}
        run: CI=true npm test -- --watchAll=false
      - name: Build
        working-directory: ${{ matrix.app }}
        run: CI=true npm run build

  # Cloudflare Worker: 타입체크 + node --test (Node 22 필요)
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-push/package-lock.json
      - name: Install
        working-directory: habit-push
        run: npm ci
      - name: Typecheck
        working-directory: habit-push
        run: npm run typecheck
      - name: Test
        working-directory: habit-push
        run: npm test

  # 빌드 없는 정적 앱: 폴더를 띄우고 Playwright 스모크 테스트
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: allowance
            port: 8138
          - app: family-bank
            port: 8139
          - app: japanese-learn
            port: 8141
          - app: tech-coach
            port: 8151
          - app: walkie-talkie
            port: 8137
          - app: hunter-town
            port: 8152
          - app: god-village
            port: 8153
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          # 일부 smoke.js 가 CHROMIUM_PATH 기본값으로 로컬 경로를 쓰므로, 여기서 설치된 크로미움 경로를 넘긴다
          echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Serve
        working-directory: ${{ matrix.app }}
        run: |
          python3 -m http.server ${{ matrix.port }} >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:${{ matrix.port }}/index.html" >/dev/null && break
            sleep 1
          done
      - name: Smoke test
        working-directory: ${{ matrix.app }}
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          SHOT: /tmp/shot.png
        run: node test/smoke.js
