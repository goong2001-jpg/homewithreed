# 톡톡 습관친구 푸시 알림 서버(habit-push)를 Cloudflare 에 배포한다.
#
# 터미널 없이 브라우저만으로 설정을 끝낼 수 있게 만든 워크플로다.
# Actions 탭에서 "Run workflow" 를 눌러 직접 실행한다.
#
# 미리 등록해야 하는 값 (Settings → Secrets and variables → Actions)
#
#   Secrets 탭
#     CLOUDFLARE_API_TOKEN   Cloudflare 에서 만든 API 토큰
#     VAPID_PRIVATE_KEY      키 만들기 페이지의 개인키
#     PUSH_PASSPHRASE        키 만들기 페이지의 알림 암호
#
#   Variables 탭
#     CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#     HABIT_KV_ID            만들어 둔 KV 네임스페이스 ID
#     VAPID_PUBLIC_KEY       키 만들기 페이지의 공개키
#     ALLOWED_ORIGIN         (선택) 앱 주소. 없으면 <계정>.github.io 로 짐작한다
#     VAPID_SUBJECT          (선택) 연락용 이메일

name: Deploy push worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 필요한 값이 다 있는지 확인
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PUSH_PASSPHRASE }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ vars.HABIT_KV_ID }}
          PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          missing=""
          [ -n "$API_TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN(시크릿)"
          [ -n "$PRIVATE_KEY" ] || missing="$missing VAPID_PRIVATE_KEY(시크릿)"
          [ -n "$PASSPHRASE" ]  || missing="$missing PUSH_PASSPHRASE(시크릿)"
          [ -n "$ACCOUNT_ID" ]  || missing="$missing CLOUDFLARE_ACCOUNT_ID(변수)"
          [ -n "$KV_ID" ]       || missing="$missing HABIT_KV_ID(변수)"
          [ -n "$PUBLIC_KEY" ]  || missing="$missing VAPID_PUBLIC_KEY(변수)"
          if [ -n "$missing" ]; then
            echo "::error::다음 값이 등록되지 않았습니다:$missing"
            echo "Settings → Secrets and variables → Actions 에서 추가한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "필요한 값이 모두 등록돼 있습니다."

      - name: 의존성 설치
        working-directory: habit-push
        run: npm ci

      - name: 배포용 설정 파일 만들기
        working-directory: habit-push
        env:
          KV_ID: ${{ vars.HABIT_KV_ID }}
          PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          OWNER: ${{ github.repository_owner }}
        # 값에 따옴표 같은 게 섞여도 깨지지 않게 파이썬 json.dumps 로 써넣는다
        run: |
          python3 - <<'PY'
          import json, os

          origin = os.environ.get('ALLOWED_ORIGIN') or f"https://{os.environ['OWNER'].lower()}.github.io"
          subject = os.environ.get('VAPID_SUBJECT') or 'mailto:noreply@example.com'

          toml = f"""name = "habit-push"
          main = "src/index.ts"
          compatibility_date = "2025-01-01"

          [triggers]
          crons = ["* * * * *"]

          [[kv_namespaces]]
          binding = "HABIT_KV"
          id = {json.dumps(os.environ['KV_ID'])}

          [vars]
          ALLOWED_ORIGIN = {json.dumps(origin)}
          VAPID_PUBLIC_KEY = {json.dumps(os.environ['PUBLIC_KEY'])}
          VAPID_SUBJECT = {json.dumps(subject)}
          """
          with open('wrangler.ci.toml', 'w') as f:
              f.write(toml)
          print(toml)
          PY

      - name: Worker 배포
        working-directory: habit-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ci.toml

      - name: 시크릿 등록
        working-directory: habit-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_PASSPHRASE: ${{ secrets.PUSH_PASSPHRASE }}
        run: |
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.ci.toml
          printf '%s' "$PUSH_PASSPHRASE"   | npx wrangler secret put PASSPHRASE       --config wrangler.ci.toml

      - name: 잘 떴는지 확인하고 주소 알려주기
        working-directory: habit-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 시크릿이 반영될 시간을 조금 준다
          sleep 10
          url=$(npx wrangler deployments list --config wrangler.ci.toml 2>/dev/null \
                | grep -oE 'https://[a-z0-9.-]+workers\.dev' | head -1 || true)
          if [ -z "$url" ]; then
            sub=$(grep -oE '^name = "[^"]+"' wrangler.ci.toml | cut -d'"' -f2)
            url="https://$sub.<계정이름>.workers.dev"
            echo "::warning::Worker 주소를 자동으로 찾지 못했습니다. Cloudflare 대시보드에서 확인하세요."
          else
            echo "확인 중: $url/health"
            curl -sS --max-time 20 "$url/health" || echo "(health 응답 없음 — 잠시 뒤 다시 열어보세요)"
            echo
          fi

          {
            echo "## 푸시 서버 배포 완료 ✅"
            echo
            echo "**Worker 주소**"
            echo
            echo '```'
            echo "$url"
            echo '```'
            echo
            echo "### 다음 할 일"
            echo
            echo "1. Settings → Secrets and variables → Actions → **Variables** 탭에서"
            echo "   \`PUSH_ENDPOINT\` 라는 이름으로 위 주소를 등록하세요."
            echo "2. Actions → **Deploy to GitHub Pages** 워크플로를 다시 실행하세요."
            echo "3. 폰에서 앱을 홈 화면에 추가하고, 설정 → 알림 암호에"
            echo "   \`PUSH_PASSPHRASE\` 와 같은 값을 넣은 뒤 푸시 알림을 켜세요."
          } >> "$GITHUB_STEP_SUMMARY"
