name: habit-push deploy

# habit-push(Cloudflare Worker) 배포 전용. 테스트·타입체크는 ci.yml 의 worker 잡이
# PR 과 모든 push 에서 돌리므로 여기서는 기본 브랜치에 push 된 뒤 한 번 더 확인하고 배포만 한다.
on:
  push:
    # 기본 브랜치는 지금 claude/intelligent-cannon-txjx76 이다. main 으로 바꾸면 여기도 바꿀 것.
    branches:
      - claude/intelligent-cannon-txjx76
    paths:
      - 'habit-push/**'
      - '.github/workflows/habit-push.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habit-push-deploy
  cancel-in-progress: true

jobs:
  # 저장소 시크릿 CLOUDFLARE_API_TOKEN 이 있어야 한다. 없으면 이 잡만 실패하고
  # 테스트 결과에는 영향이 없다 — Cloudflare 가 저장소를 직접 보고 배포하는 쪽을
  # 쓴다면 무시하거나 이 워크플로를 지워도 된다 (habit-push/README.md 참고).
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habit-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: habit-push/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: habit-push
