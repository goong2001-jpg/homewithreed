<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  body { background:#f6f8fb; color:#1f2733; padding-bottom:90px; }
  .appbar { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; padding:16px 18px; position:sticky; top:0; z-index:10; }
  .appbar .title { font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; }
  .appbar .sub { font-size:12px; opacity:.85; margin-top:3px; }
  .appbar .back { cursor:pointer; }
  .body { padding:16px; }
  .hidden { display:none !important; }

  .search { width:100%; background:#fff; border:1.5px solid #dde3ec; border-radius:12px;
            padding:13px 14px; font-size:15px; outline:none; }
  .search:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .label { font-size:12px; font-weight:700; color:#6b7889; margin:18px 2px 8px; }

  .item { background:#fff; border:1.5px solid #e6ebf2; border-radius:12px; padding:13px 14px;
          margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .item:active { background:#f0f4ff; }
  .item .nm { font-size:15px; font-weight:700; }
  .item .meta { font-size:11.5px; color:#8a97a8; margin-top:3px; }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:7px; white-space:nowrap; }
  .b-기판 { background:#eef4ff; color:#2563eb; } .b-벌크 { background:#fff3e6; color:#d97706; }
  .b-완포 { background:#eafaf0; color:#16a34a; } .b-default { background:#eef1f5; color:#6b7889; }

  .io { display:flex; gap:10px; }
  .io button { flex:1; padding:14px 0; border-radius:12px; font-size:16px; font-weight:900;
               border:2px solid #e6ebf2; background:#fff; color:#b9c2cf; cursor:pointer; }
  .io button.in.on  { background:#16a34a; color:#fff; border-color:#16a34a; }
  .io button.out.on { background:#dc2626; color:#fff; border-color:#dc2626; }

  .boxrow { background:#fff; border:1.5px solid #e6ebf2; border-radius:12px; padding:10px 12px;
            margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .boxrow .field { flex:1; } .boxrow .field .k { font-size:10.5px; color:#8a97a8; font-weight:600; }
  .boxrow input { width:100%; border:none; outline:none; font-size:18px; font-weight:900; color:#1f2733; background:transparent; }
  .boxrow .x { font-size:15px; font-weight:900; color:#b9c2cf; }
  .boxrow .eq { font-size:11px; color:#8a97a8; text-align:right; min-width:62px; }
  .boxrow .eq b { display:block; font-size:14px; color:#16a34a; }
  .boxrow .del { color:#cbd3de; font-size:18px; cursor:pointer; padding:0 2px; }
  .addline { text-align:center; color:#2563eb; font-size:13px; font-weight:700; padding:10px;
             border:1.5px dashed #b9ccf5; border-radius:12px; margin-bottom:14px; cursor:pointer; }
  .total { background:#0f172a; color:#fff; border-radius:14px; padding:14px 16px;
           display:flex; justify-content:space-between; align-items:center; }
  .total .t1 { font-size:12px; opacity:.7; } .total .t2 { font-size:24px; font-weight:900; }
  .total .t2 small { font-size:13px; opacity:.7; }

  .pick { background:#fff; border:1.5px solid #e6ebf2; border-radius:12px; padding:10px 14px;
          display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .pick .k { font-size:12px; color:#6b7889; font-weight:700; }
  .pick select, .pick input { border:none; outline:none; font-size:14px; font-weight:700; color:#1f2733;
                              text-align:right; background:transparent; max-width:60%; }

  .savebtn { position:fixed; bottom:16px; left:16px; right:16px; padding:16px; border-radius:14px;
             text-align:center; font-size:16px; font-weight:900; color:#fff; border:none; cursor:pointer; z-index:20; }
  .savebtn.in { background:#16a34a; box-shadow:0 8px 20px rgba(22,163,74,.35); }
  .savebtn.out { background:#dc2626; box-shadow:0 8px 20px rgba(220,38,38,.35); }
  .savebtn:disabled { opacity:.5; }

  .done { text-align:center; padding-top:40px; }
  .check { width:84px; height:84px; border-radius:50%; background:#16a34a; color:#fff; font-size:46px;
           display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
           box-shadow:0 10px 26px rgba(22,163,74,.35); }
  .done h2 { font-size:20px; } .res { background:#fff; border-radius:14px; padding:18px 22px;
           display:inline-block; margin-top:14px; box-shadow:0 4px 12px rgba(0,0,0,.05); }
  .res .r1 { font-size:13px; color:#8a97a8; } .res .big { font-size:30px; font-weight:900; margin:6px 0; }
  .res .r3 { font-size:13px; font-weight:700; } .res .r3.in { color:#16a34a; } .res .r3.out { color:#dc2626; }

  .filterbar { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; }
  .filterbar .f { font-size:12px; font-weight:700; padding:6px 12px; border-radius:18px; background:#fff;
                  border:1.5px solid #e6ebf2; color:#6b7889; white-space:nowrap; cursor:pointer; }
  .filterbar .f.on { background:#1f2733; color:#fff; border-color:#1f2733; }
  .srow { background:#fff; border:1.5px solid #eef1f5; border-radius:11px; padding:12px 13px; margin-bottom:8px; }
  .srow .top { display:flex; justify-content:space-between; align-items:center; }
  .srow .nm2 { font-size:14.5px; font-weight:700; } .srow .q2 { font-size:17px; font-weight:900; }
  .srow .q2.low { color:#dc2626; } .srow .b2 { font-size:11px; color:#8a97a8; margin-top:6px; }
  .warn { font-size:10px; font-weight:700; color:#dc2626; background:#fee; padding:2px 7px; border-radius:6px; }

  .nav { position:fixed; bottom:0; left:0; right:0; height:58px; border-top:1px solid #eef1f5; background:#fff; display:flex; z-index:30; }
  .nav div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:2px; font-size:10px; color:#b9c2cf; font-weight:600; cursor:pointer; }
  .nav div.on { color:#2563eb; } .nav .ic { font-size:18px; }
  .loading { text-align:center; color:#8a97a8; padding:40px; font-size:14px; }
</style>
</head>
<body>

<div class="appbar">
  <div class="title"><span id="barIcon">📦</span> <span id="barTitle">써브텍 재고</span></div>
  <div class="sub" id="barSub">입고 · 출고를 빠르게 기록하세요</div>
</div>

<!-- 검색/선택 -->
<div class="body" id="viewSearch">
  <input class="search" id="searchInput" placeholder="🔍 품명 검색 (예: STT1.3)" oninput="renderSearch()">
  <div class="label">품목</div>
  <div id="searchList"><div class="loading">불러오는 중…</div></div>
</div>

<!-- 입출고 입력 -->
<div class="body hidden" id="viewInput">
  <div class="io">
    <button class="in on" id="btnIn"  onclick="setType('입고')">＋ 입고</button>
    <button class="out"    id="btnOut" onclick="setType('출고')">－ 출고</button>
  </div>
  <div class="label">박스 구성 (입수가 달라도 줄을 추가하세요)</div>
  <div id="boxRows"></div>
  <div class="addline" onclick="addLine()">＋ 다른 입수 박스 추가</div>
  <div class="total"><div class="t1" id="totLbl">입고 합계</div><div class="t2" id="totVal">0<small> 개</small></div></div>
  <div class="pick"><span class="k">보관 위치</span>
    <select id="locSel"><option>1층</option><option>2층</option><option>창고</option><option>B동</option></select></div>
  <div class="pick"><span class="k">담당자</span><select id="staffSel"></select></div>
  <div class="pick"><span class="k">메모</span><input id="memoInput" placeholder="선택 입력"></div>
  <button class="savebtn in" id="saveBtn" onclick="doSave()">＋ 입고 저장</button>
</div>

<!-- 완료 -->
<div class="body hidden" id="viewDone">
  <div class="done">
    <div class="check">✓</div>
    <h2 id="doneTitle">입고 저장 완료!</h2>
    <div class="res">
      <div class="r1" id="doneItem"></div>
      <div class="big" id="doneTotal"></div>
      <div class="r3 in" id="doneDelta"></div>
    </div>
    <div style="margin-top:18px"><button class="addline" style="display:inline-block;padding:12px 28px" onclick="go('search')">새 품목 입력</button></div>
  </div>
</div>

<!-- 현재고 -->
<div class="body hidden" id="viewStock">
  <div class="filterbar" id="filterBar"></div>
  <div id="stockList"></div>
</div>

<div class="nav">
  <div id="navInput" class="on" onclick="go('search')"><span class="ic">➕</span>입출고</div>
  <div id="navStock" onclick="go('stock')"><span class="ic">📊</span>현재고</div>
</div>

<script>
var DATA = { items: [], staff: [] };
var cur = null;        // 선택된 품목
var type = '입고';
var lines = [{ boxes:'', per:'' }];
var stockFilter = '전체';

google.script.run.withSuccessHandler(onBoot).withFailureHandler(onErr).bootstrap();

function onBoot(d) {
  DATA = d;
  var sel = document.getElementById('staffSel');
  sel.innerHTML = (d.staff.length ? d.staff : ['담당자']).map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
  renderSearch();
}
function onErr(e){ document.getElementById('searchList').innerHTML = '<div class="loading">오류: '+esc(e.message)+'</div>'; }

function badge(cat){ var c=['기판','벌크','완포'].indexOf(cat)>=0?cat:'default'; return '<span class="badge b-'+c+'">'+esc(cat||'-')+'</span>'; }
function fmt(n){ return (Number(n)||0).toLocaleString(); }
function esc(s){ return (''+s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ---- 검색 ----
function renderSearch() {
  var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var list = DATA.items.filter(function(it){ return !q || (it.name+'').toLowerCase().indexOf(q)>=0; }).slice(0,60);
  var el = document.getElementById('searchList');
  if (!list.length) { el.innerHTML = '<div class="loading">검색 결과가 없습니다.</div>'; return; }
  el.innerHTML = list.map(function(it,i){
    var idx = DATA.items.indexOf(it);
    return '<div class="item" onclick="select('+idx+')">'+
      '<div><div class="nm">'+esc(it.name)+'</div><div class="meta">현재 '+fmt(it.total)+'개</div></div>'+
      badge(it.cat)+'</div>';
  }).join('');
}

function select(i){ cur = DATA.items[i]; type='입고'; lines=[{boxes:'',per:String(cur.unit||'')}]; renderInput(); go('input'); }

// ---- 입력 ----
function setType(t){ type=t; renderInput(); }
function addLine(){ lines.push({boxes:'',per:String(cur.unit||'')}); renderInput(); }
function delLine(i){ lines.splice(i,1); if(!lines.length) lines=[{boxes:'',per:''}]; renderInput(); }
function onInput(i,f,v){ lines[i][f]=v; updateTotal(); }
function lineTotal(l){ return (Number(l.boxes)||0)*(Number(l.per)||0); }
function grandTotal(){ return lines.reduce(function(s,l){return s+lineTotal(l);},0); }

function renderInput(){
  document.getElementById('barIcon').textContent = '📦';
  document.getElementById('barTitle').textContent = cur.name;
  document.getElementById('barSub').textContent = cur.cat + ' · 현재 ' + fmt(cur.total) + '개';
  document.getElementById('btnIn').className  = 'in '  + (type==='입고'?'on':'');
  document.getElementById('btnOut').className = 'out ' + (type==='출고'?'on':'');
  var rows = lines.map(function(l,i){
    return '<div class="boxrow">'+
      '<div class="field"><div class="k">박스수</div><input type="number" inputmode="numeric" value="'+esc(l.boxes)+'" oninput="onInput('+i+',\'boxes\',this.value)"></div>'+
      '<div class="x">×</div>'+
      '<div class="field"><div class="k">박스당 수량</div><input type="number" inputmode="numeric" value="'+esc(l.per)+'" oninput="onInput('+i+',\'per\',this.value)"></div>'+
      '<div class="eq">합계<b>'+fmt(lineTotal(l))+'</b></div>'+
      (lines.length>1?'<span class="del" onclick="delLine('+i+')">✕</span>':'')+
    '</div>';
  }).join('');
  document.getElementById('boxRows').innerHTML = rows;
  updateTotal();
}
function updateTotal(){
  var t = grandTotal(), inMode = type==='입고';
  document.getElementById('totLbl').textContent = inMode?'입고 합계':'출고 합계';
  document.getElementById('totVal').innerHTML = (inMode?'+':'−')+fmt(t)+'<small> 개</small>';
  // 줄 합계 갱신
  document.querySelectorAll('#boxRows .eq b').forEach(function(b,i){ b.textContent = fmt(lineTotal(lines[i])); });
  var btn = document.getElementById('saveBtn');
  btn.className = 'savebtn ' + (inMode?'in':'out');
  btn.textContent = inMode?'＋ 입고 저장':'－ 출고 저장';
  btn.disabled = t<=0;
}

function doSave(){
  var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='저장 중…';
  var payload = { id:cur.id, name:cur.name, cat:cur.cat, type:type,
    loc:document.getElementById('locSel').value, staff:document.getElementById('staffSel').value,
    memo:document.getElementById('memoInput').value, lines:lines };
  var delta = grandTotal();
  google.script.run.withSuccessHandler(function(res){ onSaved(res, delta); })
    .withFailureHandler(function(e){ alert('저장 실패: '+e.message); updateTotal(); }).save(payload);
}
function onSaved(res, delta){
  // 로컬 데이터 갱신
  cur.total = res.total; cur.locs = res.locs;
  var inMode = type==='입고';
  document.getElementById('doneTitle').textContent = (inMode?'입고':'출고')+' 저장 완료!';
  document.getElementById('doneItem').textContent = cur.name+' · '+cur.cat;
  document.getElementById('doneTotal').textContent = fmt(res.total)+'개';
  var dd=document.getElementById('doneDelta');
  dd.className='r3 '+(inMode?'in':'out');
  dd.textContent=(inMode?'＋':'−')+fmt(delta)+' '+(inMode?'입고':'출고')+' ('+document.getElementById('staffSel').value+')';
  document.getElementById('memoInput').value='';
  go('done');
}

// ---- 현재고 ----
function renderStock(){
  var cats = ['전체'].concat(DATA.items.map(function(i){return i.cat;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;}));
  document.getElementById('filterBar').innerHTML = cats.map(function(c){
    return '<div class="f '+(c===stockFilter?'on':'')+'" onclick="setFilter(\''+esc(c)+'\')">'+esc(c)+'</div>';
  }).join('');
  var list = DATA.items.filter(function(it){ return (stockFilter==='전체'||it.cat===stockFilter); })
    .sort(function(a,b){return b.total-a.total;});
  var max = Math.max(1, list.reduce(function(m,i){return Math.max(m,i.total);},0));
  document.getElementById('stockList').innerHTML = list.map(function(it){
    var low = it.safe>0 && it.total<it.safe;
    var locs = Object.keys(it.locs||{}).map(function(k){return k+' '+fmt(it.locs[k]);}).join(' · ') || '-';
    var color = low?'#dc2626':(it.cat==='기판'?'#2563eb':'#16a34a');
    return '<div class="srow"><div class="top">'+
      '<span class="nm2">'+esc(it.name)+' '+badge(it.cat)+'</span>'+
      '<span class="q2'+(low?' low':'')+'">'+fmt(it.total)+(low?' <span class="warn">안전재고 ↓</span>':'')+'</span></div>'+
      '<div class="srow-bar" style="height:6px;background:#eef1f5;border-radius:4px;margin-top:8px;overflow:hidden">'+
        '<i style="display:block;height:100%;border-radius:4px;width:'+Math.round(it.total/max*100)+'%;background:'+color+'"></i></div>'+
      '<div class="b2">'+esc(locs)+(it.safe>0?(' · 안전재고 '+fmt(it.safe)):'')+'</div></div>';
  }).join('') || '<div class="loading">품목이 없습니다.</div>';
}
function setFilter(c){ stockFilter=c; renderStock(); }

// ---- 화면 전환 ----
function go(v){
  ['Search','Input','Done','Stock'].forEach(function(n){ document.getElementById('view'+n).classList.add('hidden'); });
  document.getElementById('navInput').className = (v==='stock'?'':'on');
  document.getElementById('navStock').className = (v==='stock'?'on':'');
  if(v==='search'){ document.getElementById('view'+'Search').classList.remove('hidden'); resetBar(); renderSearch(); }
  if(v==='input'){ document.getElementById('viewInput').classList.remove('hidden'); }
  if(v==='done'){ document.getElementById('viewDone').classList.remove('hidden'); resetBar(); }
  if(v==='stock'){ document.getElementById('viewStock').classList.remove('hidden'); resetBar('📊','현재고','실시간 자동 집계'); renderStock(); }
}
function resetBar(ic,t,s){
  document.getElementById('barIcon').textContent = ic||'📦';
  document.getElementById('barTitle').textContent = t||'써브텍 재고';
  document.getElementById('barSub').textContent = s||'입고 · 출고를 빠르게 기록하세요';
}
</script>
</body>
</html>
