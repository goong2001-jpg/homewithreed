<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
#locApp{
  --bg:#D8DAD5;--paper:#ECEDE9;--ink:#1F2326;--sub:#5B6367;--line:#979D99;
  --slot:#FFFFFF;--label:#2F3639;--labelink:#EEEFEA;--sel:#F2C230;--hitbg:#FFEFB8;--hitline:#B98C08;
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #locApp{
    --bg:#191C1E;--paper:#232729;--ink:#E3E5E0;--sub:#9AA09C;--line:#4B5155;
    --slot:#2C3134;--label:#C8CBC5;--labelink:#191C1E;--hitbg:#4A3F17;--hitline:#F2C230;
  }
}
:root[data-theme="dark"] #locApp{
  --bg:#191C1E;--paper:#232729;--ink:#E3E5E0;--sub:#9AA09C;--line:#4B5155;
  --slot:#2C3134;--label:#C8CBC5;--labelink:#191C1E;--hitbg:#4A3F17;--hitline:#F2C230;
}
#locApp.solo{min-height:100vh}
#locApp *,#locApp *::before,#locApp *::after{box-sizing:border-box}
#locApp button,#locApp input,#locApp textarea{font:inherit;color:inherit}
#locApp button{cursor:pointer}
#locApp :focus-visible{outline:2px solid var(--hitline);outline-offset:2px}

#locApp .top{padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px}
#locApp .titleRow{display:flex;align-items:baseline;gap:10px}
#locApp h1{margin:0;font-size:19px;font-weight:700;flex:1}
#locApp .status{font-size:12px;color:var(--sub)}
#locApp .back{background:none;border:0;padding:0;color:var(--sub);font-size:13px;text-decoration:underline}
#locApp .search{position:relative}
#locApp .search input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper)}
#locApp .results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--paper);
  border:1.5px solid var(--line);border-radius:4px;max-height:50vh;overflow:auto}
#locApp .results[hidden]{display:none}
#locApp .results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:8px 12px;
  background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
#locApp .results .rw{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#locApp .results .none{margin:0;padding:10px 12px;color:var(--sub)}

#locApp .tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
#locApp .tabs::-webkit-scrollbar{display:none}
#locApp .tab{flex:0 0 auto;padding:8px 12px;border:1.5px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:transparent;white-space:nowrap}
#locApp .tab.on{background:var(--paper);font-weight:700;border-color:var(--ink)}
#locApp .tab.add{border-style:dashed;color:var(--sub)}

#locApp .floor{background:var(--paper);border-top:1.5px solid var(--ink)}
#locApp .floor.merging{border-top:6px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--sel) 0 10px,#1F2326 10px 20px) 6}
#locApp .tools{display:flex;gap:6px;padding:10px 12px 4px;flex-wrap:wrap}
#locApp .tools button{padding:7px 11px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg)}
#locApp .tools button.on{background:var(--sel);border-color:#1F2326;color:#1F2326;font-weight:700}
#locApp .hint{margin:0;padding:2px 12px 0;font-size:12.5px;color:var(--sub)}
#locApp .hint[hidden]{display:none}
#locApp .mergeBar{display:flex;align-items:center;gap:8px;padding:8px 12px 0}
#locApp .mergeBar[hidden]{display:none}
#locApp .mergeBar span{flex:1;font-size:13.5px}
#locApp .mergeBar button{padding:7px 12px;border-radius:4px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
#locApp .mergeBar button.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}

#locApp .wrap{overflow-x:auto;padding:10px 12px 28px}
#locApp{--cw:96px;--ch:78px;--fz:13.5px}
#locApp .grid{display:grid;gap:4px;grid-auto-rows:minmax(var(--ch),auto);min-width:min-content}
#locApp .cell{position:relative;min-height:var(--ch);font-size:var(--fz);border:1.5px solid var(--line);background:var(--slot);border-radius:3px;
  text-align:left;padding:4px 5px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
#locApp .cell .code{font-size:.75em;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
#locApp .cell .name{font-weight:700;font-size:1em;line-height:1.25;overflow-wrap:anywhere}
#locApp .layers{display:flex;flex-direction:column;flex:1}
#locApp .layer{flex:1;font-size:1em;line-height:1.3;padding:2px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
#locApp .layer:first-child{border-top:0}
#locApp .layer b.ly{display:block;font-size:.72em;font-weight:500;color:var(--sub)}
/* 칸 안 품목: 한 줄에 하나, 이름 + 굵은 수량. 📌지정 제품은 왼쪽 노란 막대 */
#locApp .it{display:block;font-weight:600;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
#locApp .it b{font-weight:800;font-variant-numeric:tabular-nums}
#locApp .it b.q0{opacity:.4;font-weight:400}
#locApp .it.pin{border-left:3px solid var(--hitline);padding-left:4px}
#locApp .it.memo{font-weight:400;color:var(--sub);font-size:.88em}
#locApp .more{display:block;font-size:.8em;color:var(--sub)}
#locApp .zoom{display:inline-flex;gap:0;margin-left:auto}
#locApp .tools .zoom button{border-radius:0;min-width:44px}
#locApp .tools .zoom button:first-child{border-radius:4px 0 0 4px}
#locApp .tools .zoom button:last-child{border-radius:0 4px 4px 0;border-left:0}
#locApp .layer i,#locApp .cell .lbl i{font-style:normal;color:var(--sub);opacity:.75}
#locApp .cell.label{background:var(--label);border-color:var(--label);color:var(--labelink);align-items:center;justify-content:center;text-align:center}
#locApp .cell.label .lbl{font-weight:700;font-size:1.15em;overflow-wrap:anywhere}
#locApp .cell.label .lbl i{color:inherit}
#locApp .cell.void{background:transparent;border-style:dashed}
#locApp .cell.void .code{opacity:.6}
#locApp .cell.void .name{color:var(--sub)}

/* 합친 칸: 이름을 가운데, 크게, 칸 수만큼 자간을 벌림 (복   도) */
#locApp .cell.big{align-items:center;justify-content:center;text-align:center;padding-top:18px}
#locApp .cell.big .code{position:absolute;top:4px;left:5px}
#locApp .cell.big .name,#locApp .cell.big .lbl{font-size:var(--fs);letter-spacing:var(--ls);text-indent:var(--ls);line-height:1.2}
#locApp .cell.big.tall .name,#locApp .cell.big.tall .lbl{writing-mode:vertical-rl;text-orientation:upright;text-indent:0;padding-top:var(--ls)}
#locApp .cell.big .layers{flex:0 0 auto;width:100%;margin-top:6px}
#locApp .cell.big .layer{text-align:center}

#locApp .cell.hit{background:var(--hitbg);border-color:var(--hitline)}
#locApp .cell.sel{box-shadow:inset 0 0 0 3px var(--sel);border-color:#1F2326}
#locApp .cell.flash{animation:locFlash 1.4s ease-out}
@keyframes locFlash{0%,40%{box-shadow:inset 0 0 0 4px var(--hitline)}100%{box-shadow:inset 0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){#locApp .cell.flash{animation:none;box-shadow:inset 0 0 0 3px var(--hitline)}}

#locApp .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
#locApp .shade[hidden],#locApp .panel[hidden],#locApp .toast[hidden]{display:none}
#locApp .panel{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-top:2px solid var(--ink);
  max-height:78vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#locApp .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
#locApp .ph h2{margin:0;font-size:18px}
#locApp .ph small{font-size:12.5px;font-weight:400;color:var(--sub);margin-left:4px}
#locApp .x{background:none;border:0;color:var(--sub);padding:4px 2px}
#locApp .seg{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px}
#locApp .seg button{flex:1;padding:8px 4px;border:0;background:transparent}
#locApp .seg button+button{border-left:1.5px solid var(--ink)}
#locApp .seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
#locApp .f{display:block;font-size:13px;color:var(--sub);margin-bottom:10px}
#locApp .f input,#locApp .f textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1.5px solid var(--line);
  border-radius:4px;background:var(--slot);color:var(--ink);font-size:15px;resize:vertical}
#locApp .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#locApp .acts button{padding:8px 12px;border:1.5px solid var(--ink);border-radius:4px;background:transparent}
#locApp .acts button.danger{border-color:#B3412E;color:#B3412E}
#locApp .acts button.danger.arm{background:#B3412E;color:#fff}
#locApp .step{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#locApp .step span{flex:1;font-size:14px}
#locApp .step button{width:40px;height:36px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;font-size:18px}
#locApp .step b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
#locApp .note{font-size:12.5px;color:var(--sub);margin:6px 0 10px}
/* 재고 연동 */
#locApp .layer em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
#locApp .cell.stocked{border-color:var(--ink)}
#locApp .stkbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
#locApp .stkbar:empty{display:none}
#locApp .stkbar button{padding:7px 11px;border:1.5px solid var(--hitline);border-radius:4px;background:var(--hitbg);font-size:13.5px;text-align:left}
#locApp .stkbar button.warn{border-color:#B3412E;background:transparent;color:#B3412E}
#locApp .sk{margin:4px 0 12px}
#locApp .sk h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#locApp .sk h3 small{font-size:11.5px;font-weight:400;color:var(--sub)}
/* 재고앱 화면 안에 들어갈 때 바깥(Index) 스타일이 섞이지 않게 */
#locApp .search{width:auto;background:none;border:0;border-radius:0;padding:0;box-shadow:none;font-size:inherit}
#locApp .srow{background:none;border:0;border-radius:0;margin:0;cursor:default}
#locApp .srow:active{background:none}
#locApp .pick{margin:0;border-radius:0}
#locApp p,#locApp h1,#locApp h2,#locApp h3{font-family:inherit}
/* 자재별 위치·수량 카드 (검색 결과, 품목 패널) */
#locApp .icard{padding:8px 12px 6px;border-bottom:1.5px solid var(--line)}
#locApp .icard .ih{display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
#locApp .icard .ih b{font-size:15.5px}
#locApp .icard .ih small{color:var(--sub);font-size:12px}
#locApp .icard .tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#locApp .results .icard button,#locApp .icard .lr{display:flex;flex-direction:row;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  padding:6px 0 6px 10px;border:0;border-top:1px dashed var(--line);background:none;text-align:left;font-size:14px}
#locApp .icard .lr b{font-variant-numeric:tabular-nums;white-space:nowrap}
#locApp .icard .lr.z{color:var(--sub)}
#locApp .rsec{margin:0;padding:6px 12px 2px;font-size:12px;color:var(--sub)}
#locApp .srow .nm[data-item]{text-decoration:underline;text-decoration-color:var(--line);cursor:pointer}
#locApp .srow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px dashed var(--line)}
#locApp .srow:first-of-type{border-top:0}
#locApp .srow .nm{flex:1;min-width:0;word-break:keep-all}
#locApp .srow .nm small{color:var(--sub);margin-left:4px}
#locApp .srow b{font-variant-numeric:tabular-nums;white-space:nowrap}
#locApp .srow button,#locApp .sk .in{padding:5px 9px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;font-size:13px;white-space:nowrap}
#locApp .sk .in{margin-top:6px;background:var(--ink);color:var(--paper);font-weight:700}
#locApp .sk .mv{margin:6px 0 0 6px;padding:5px 9px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;font-size:13px}
#locApp .mvall{display:block;width:100%;margin:0 0 12px;padding:9px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sel);color:#1F2326;font-weight:700}
#locApp .cell.src{box-shadow:inset 0 0 0 3px var(--hitline)}
#locApp .mvto{font-size:14px;margin:0 0 6px}
#locApp .mvto b{font-weight:700}
#locApp .srow input{width:76px;padding:5px 6px;border:1.5px solid var(--line);border-radius:4px;background:var(--slot);text-align:right;font-variant-numeric:tabular-nums}
#locApp .f select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--slot);color:var(--ink);font-size:15px}
#locApp .chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 12px}
#locApp .layer em.z{opacity:.45}
#locApp .pp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
#locApp .pp .pk{font-size:12.5px;color:var(--sub)}
#locApp .chip{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 9px;border:1.5px solid var(--hitline);background:var(--hitbg);border-radius:999px;font-size:13px}
#locApp .chip button{border:0;background:none;padding:0 5px;color:var(--sub);font-size:13px}
#locApp .pick{display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px 4px;border:0;border-top:1px dashed var(--line);background:none;text-align:left}
#locApp .pick small{color:var(--sub)}
#locApp .acts button:disabled{opacity:.4;cursor:default}
#locApp .qin .row3{display:flex;align-items:flex-end;gap:8px}
#locApp .qin .row3 .f{flex:1;margin-bottom:0}
#locApp .qin .row3 .x2{padding-bottom:10px;color:var(--sub)}
#locApp .qin .sum{font-size:20px;font-weight:700;margin:10px 0 12px;font-variant-numeric:tabular-nums}
#locApp .qin .picked{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--hitline);background:var(--hitbg);border-radius:4px;margin-bottom:10px}
#locApp .qin .picked button{border:0;background:none;color:var(--sub);text-decoration:underline;padding:0}
#locApp .qin .plist{max-height:34vh;overflow:auto;margin:-4px 0 10px}
#locApp .qin .warn2{color:#B3412E;font-size:13px;margin:-4px 0 10px}
#locApp .qin .warn2[hidden]{display:none}
#locApp .results .newin{display:block;width:100%;padding:10px 12px;border:0;border-bottom:1.5px solid var(--line);background:var(--hitbg);font-weight:700;text-align:left}
#locApp .sk .none{color:var(--sub);font-size:13px;margin:2px 0}
#locApp .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:4px;font-size:13.5px;z-index:40;max-width:90vw}
</style>

<div id="locApp">
  <div class="top">
    <div class="titleRow"><h1>써브텍 자재 위치도</h1><span class="status" data-el="status"></span><button class="back" data-el="back" hidden>재고앱으로</button></div>
    <div class="search">
      <input data-el="q" type="search" placeholder="자재 이름으로 위치 찾기" autocomplete="off">
      <div class="results" data-el="results" hidden></div>
    </div>
  </div>
  <nav class="tabs" data-el="tabs"></nav>
  <main class="floor" data-el="floor">
    <div class="tools">
      <button data-el="bMerge">칸 합치기</button>
      <button data-el="bLine">줄·칸 옮기기</button>
      <button data-el="bSheet">시트 설정</button>
      <button data-el="bBackup">가져오기·내보내기</button>
      <span class="zoom"><button data-el="zOut" aria-label="칸 작게">가−</button><button data-el="zIn" aria-label="칸 크게">가＋</button></span>
    </div>
    <p class="hint" data-el="hint">칸을 누르면 이름과 자재를 적을 수 있어요.</p>
    <div class="stkbar" data-el="stkBar"></div>
    <div class="mergeBar" data-el="moveBar" hidden><span data-el="moveInfo"></span><button class="ghost" data-el="bMvCancel">취소</button></div>
    <div class="mergeBar" data-el="mergeBar" hidden><span data-el="mergeInfo"></span><button class="ghost" data-el="bCancel">취소</button><button data-el="bDoMerge">합치기</button></div>
    <div class="wrap"><div class="grid" data-el="grid"></div></div>
  </main>
  <div class="shade" data-el="shade" hidden></div>
  <section class="panel" data-el="panel" hidden><div data-el="panelBody"></div></section>
  <div class="toast" data-el="toast" hidden></div>
</div>

<script>
(function(){
const root=document.getElementById('locApp');
const E=n=>root.querySelector('[data-el="'+n+'"]');
const KEY='subtek-map-v1';
const GAS=(typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;
/* 재고앱(Index) 안에 들어가 있으면 true — 데이터는 재고앱이 한 번에 불러와 넘겨줌(locApi), 화면 이동도 재고앱이 처리(locHost) */
const HOSTED=!!window.LOC_HOSTED;
const host=()=>HOSTED&&window.locHost?window.locHost:null;
const K=(r,c)=>r+','+c;
/* 줄 코드: A~Z 다음은 AA, AB … (엑셀식). A~Z 칸은 예전과 같아서 기존 재고 위치 이름이 그대로 유지됨 */
const MAXR=50,MAXC=50;
const rowCode=r=>{let s='';r++;while(r>0){const m=(r-1)%26;s=String.fromCharCode(65+m)+s;r=Math.floor((r-1)/26)}return s};
const code=(r,c)=>rowCode(r)+(c+1);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const lines=t=>String(t||'').split('\n').map(v=>v.trim()).filter(Boolean);
const uid=()=>Math.random().toString(36).slice(2,9);
const def=()=>({type:'slot',label:'',layers:[{t:''}],rs:1,cs:1});

let S=null,mergeMode=false,sel=new Set(),cur=null,flashKey=null,delArm=false;
let version=0,dirty=false,saving=false,saveTimer=null;
/* 재고앱 연동: STK = {위치이름: [{id,name,cat,qty}]}, APP = 재고앱 주소 */
let STK={},APP='',stockLoaded=false,pendingQ='',STAFF=[],ITEMS=[],ITEMMAP={};
/* 위치도 안 이동: MV = {label, parts:[{from, layer(원래 칸의 층 번호|null), items:[{id,name,cat,qty}], to}], src:{si,r,c}|null} */
let MV=null;
/* 검색에서 '새 품목으로 입고' → 칸 고르기 상태: PIN = {name} */
let PIN=null;

/* 단독 화면이면 전체 높이 사용 */
if(root.parentElement===document.body&&document.body.querySelectorAll(':scope > div,:scope > main,:scope > section').length===1){
  root.classList.add('solo');document.body.style.margin='0';
}

function blank(name,rows,cols){return{id:uid(),name,rows,cols,cells:{}}}
function seed(){
  const a=blank('시트 1',4,6),c=a.cells;
  c[K(0,0)]=Object.assign(def(),{type:'label',label:'현관'});
  c[K(1,0)]=Object.assign(def(),{type:'label'});
  c[K(1,1)]=Object.assign(def(),{layers:[{t:''},{t:''}]});
  c[K(2,0)]=Object.assign(def(),{type:'label'});
  c[K(3,0)]=Object.assign(def(),{type:'label'});
  [2,3].forEach(r=>[3,4,5].forEach(k=>c[K(r,k)]=Object.assign(def(),{type:'void'})));
  const s=[a];for(let i=2;i<=5;i++)s.push(blank('시트 '+i,5,6));
  return{sheets:s,cur:0};
}
function valid(o){return o&&Array.isArray(o.sheets)&&o.sheets.length}
function parse(j){try{const o=JSON.parse(j);return valid(o)?o:null}catch(e){return null}}
function fixCur(){S.cur=Math.min(Math.max(0,S.cur||0),S.sheets.length-1)}
const sh=()=>S.sheets[S.cur];
const get=(s,r,c)=>s.cells[K(r,c)]||def();
function ensure(s,r,c){const k=K(r,c);if(!s.cells[k])s.cells[k]=def();return s.cells[k]}
const hasContent=x=>String(x.label||'').trim()||(x.layers||[]).some(L=>String(L.t||'').trim()||(L.p||[]).length);
/* 지정 제품: 칸의 층마다 L.p = [{id, name}] (재고가 0이어도 칸에 이름이 보임) */
const prodName=pr=>(ITEMMAP[pr.id]&&ITEMMAP[pr.id].name)||pr.name||pr.id;
const uniqP=a=>a.filter((x,i)=>a.findIndex(y=>y.id===x.id)===i);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- 재고 연동 ----------
   위치 이름 = "시트이름 칸코드" (+ 2층 이상은 " N층"). Location.gs 의 locSlots_ 와 같은 규칙. */
const fmtN=n=>(Number(n)||0).toLocaleString();
const slotKey=(s,r,c,i)=>String(s.name||'').trim()+' '+code(r,c)+(i?' '+(i+1)+'층':'');
const stockAt=k=>STK[k]||[];
function keysAt(s,r,c){const x=get(s,r,c);return x.type==='slot'?x.layers.map((L,i)=>slotKey(s,r,c,i)):[]}
function covered(s){const cov={};for(const k in s.cells){const x=s.cells[k];if(x.rs>1||x.cs>1){const[r,c]=k.split(',').map(Number);
  for(let i=r;i<r+x.rs;i++)for(let j=c;j<c+x.cs;j++)if(i!==r||j!==c)cov[K(i,j)]=1}}return cov}
/** 시트의 모든 보관칸 위치 이름 → {key:[r,c,layer]} */
function sheetKeys(s){const cov=covered(s),o={};for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++){if(cov[K(r,c)])continue;
  keysAt(s,r,c).forEach((k,i)=>o[k]=[r,c,i])}return o}
const cellHasStock=(s,r,c,from)=>keysAt(s,r,c).slice(from||0).some(k=>stockAt(k).length);
/** 어느 시트에도 연결되지 않은 재고 위치 (예: 옛 이름 "1층", 시트 이름과 다른 "A동2층") */
function orphanLocs(){const known={};S.sheets.forEach(s=>{known[String(s.name||'').trim()]=1;Object.assign(known,sheetKeys(s))});
  return Object.keys(STK).filter(k=>!known[k]&&STK[k].length).sort((a,b)=>sum(STK[b])-sum(STK[a]))}
const sum=a=>a.reduce((t,x)=>t+x.qty,0);
/** 재고 때문에 막아야 하면 안내하고 true */
function guard(cond,msg){if(GAS&&!stockLoaded){toast('재고 정보를 불러오는 중이에요. 잠시 후 다시 해주세요');return true}
  if(cond){toast(msg);return true}return false}
function loadStock(){if(!GAS)return;GAS.withSuccessHandler(res=>{STK=(res&&res.stock)||{};APP=(res&&res.appUrl)||APP;STAFF=(res&&res.staff)||STAFF;if(res&&res.items){ITEMS=res.items;ITEMMAP={};ITEMS.forEach(it=>ITEMMAP[it.id]=it)}stockLoaded=true;
  if(S){renderGrid();renderStockBar();const kind=E('panelBody').dataset.kind;
    if(!E('panel').hidden){if(kind==='cell'&&cur)drawCell();else if(kind==='loose')openLoose();else if(kind==='orph')openOrphans()}}})
  .withFailureHandler(()=>toast('재고를 불러오지 못했어요. 새로고침해 주세요')).locStock()}
/** 재고앱 열기 (item/loc/mode). 저장 중이면 먼저 저장 */
function openApp(p){
  if(host()){closePanel();host().open(p||{});return}
  if(dirty||saving){flush();toast('위치도를 저장 중이에요. 잠시 후 다시 눌러주세요');return}
  if(!APP){toast('재고앱 주소를 불러오는 중이에요. 잠시 후 다시 눌러주세요');return}

function stockRows(list,loc){return list.length?list.map(a=>`<div class="srow"><span class="nm" data-item="${esc(a.id)}">${esc(a.name)}${a.cat?`<small>${esc(a.cat)}</small>`:''}</span><b>${fmtN(a.qty)}</b>`+
  `<button data-go="출고" data-id="${esc(a.id)}" data-loc="${esc(loc)}">출고</button><button data-mvid="${esc(a.id)}" data-loc="${esc(loc)}">이동</button></div>`).join('')
  :'<p class="none">재고 없음</p>'}
function bindGo(P){P.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>openIn(b.dataset.in));P.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openItem(b.dataset.item));P.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openApp({item:b.dataset.id,loc:b.dataset.loc,mode:b.dataset.go}));
  P.querySelectorAll('[data-mvid]').forEach(b=>b.onclick=()=>{const a=stockAt(b.dataset.loc).find(x=>x.id===b.dataset.mvid);if(!a)return;
    startMove({label:a.name+' '+fmtN(a.qty)+'개',parts:[{from:b.dataset.loc,layer:null,items:[a]}],src:P.dataset.kind==='cell'&&cur?{si:S.cur,r:cur.r,c:cur.c}:null})});
  P.querySelectorAll('[data-mvloc]').forEach(b=>b.onclick=()=>{const l=b.dataset.mvloc;
    startMove({label:l+' 전체 '+fmtN(sum(stockAt(l)))+'개',parts:[{from:l,layer:null,items:stockAt(l).slice()}],src:null})})}
function renderStockBar(){

  ${o.map(k=>`<div class="sk"><h3>${esc(k)}<small>${fmtN(sum(STK[k]))}개</small></h3>${stockRows(STK[k],k)}${STK[k].length>1?`<button class="mv" data-mvloc="${esc(k)}">⇄ 전체 이동</button>`:''}</div>`).join('')}`;
  P.querySelector('[data-a="close"]').onclick=closePanel;bindGo(P);openPanel()}

let tt;function toast(m){const t=E('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
function setStatus(m){E('status').textContent=m}

/* ---------- 저장 (재고앱: 구글시트 / 그 외: 이 기기) ---------- */
function save(){
  if(!GAS){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('이 기기에 저장하지 못했어요')}return}
  dirty=true;setStatus('저장 대기');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(!GAS||!dirty)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return}
  saving=true;dirty=false;setStatus('저장 중');
  GAS.withSuccessHandler(res=>{
    saving=false;
    if(res&&res.ok){version=res.version;setStatus(dirty?'저장 대기':'저장됨');mapToHost();if(dirty)flush();return}
    if(res&&res.conflict){
      const o=parse(res.data);if(o){const c=S.cur;S=o;S.cur=c;fixCur()}
      version=res.version;dirty=false;closePanel();render();setStatus('저장됨');
      toast('다른 사람이 먼저 고쳐서 최신 내용으로 바꿨어요. 방금 적은 칸을 다시 확인해 주세요');
    }
  }).withFailureHandler(()=>{
    saving=false;dirty=true;setStatus('저장 실패, 다시 시도 중');clearTimeout(saveTimer);saveTimer=setTimeout(flush,5000);
  }).locSave(JSON.stringify(S),version);
}
function loadServer(quiet){
  if(!quiet)setStatus('불러오는 중');
  GAS.withSuccessHandler(res=>{
    const o=res&&res.data?parse(res.data):null;version=(res&&res.version)||0;
    const c=S?S.cur:0;
    if(o){S=o;S.cur=c;fixCur();setStatus('저장됨');render()}
    else if(!S){S=seed();render();save()}
    applyPendingQ();
  }).withFailureHandler(()=>{setStatus('불러오기 실패');if(!S){S=seed();render()}toast('시트를 불러오지 못했어요. 새로고침해 주세요')}).locGet();
}
document.addEventListener('visibilitychange',()=>{if(HOSTED)return; // 재고앱 안에서는 재고앱이 새로고침
  if(GAS&&S&&document.visibilityState==='visible'&&!dirty&&!saving&&E('panel').hidden){loadServer(true);loadStock()}
});

/* ---------- 그리기 ---------- */
function render(){if(!S)return;renderTabs();renderGrid();renderMerge();renderStockBar();renderMoveBar()}
function renderTabs(){
  const t=E('tabs');t.innerHTML='';
  S.sheets.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===S.cur?' on':'');b.textContent=s.name;

  const a=document.createElement('button');a.className='tab add';a.textContent='+ 시트';
  a.onclick=()=>{let n=S.sheets.length+1;while(S.sheets.some(s=>String(s.name).trim()==='시트 '+n))n++;S.sheets.push(blank('시트 '+n,5,6));S.cur=S.sheets.length-1;save();render();setTimeout(()=>t.scrollLeft=9999,0)};
  t.appendChild(a);

const query=()=>E('q').value.trim().toLowerCase();
const matches=(x,q)=>String(x.label||'').toLowerCase().includes(q)||(x.type==='slot'&&x.layers.some(L=>String(L.t||'').toLowerCase().includes(q)||(L.p||[]).some(pr=>prodName(pr).toLowerCase().includes(q))));
const stockMatch=(s,r,c,q)=>keysAt(s,r,c).some(k=>stockAt(k).some(a=>String(a.name).toLowerCase().includes(q)));
function cellHTML(x,r,c,s){
  const cd=`<span class="code">${code(r,c)}</span>`;
  if(x.type==='label')return `${x.rs*x.cs>1?cd:''}<span class="lbl">${x.label?esc(x.label):'<i>이름표</i>'}</span>`;
  if(x.type==='void')return cd+(x.label?`<span class="name">${esc(x.label)}</span>`:'');
  let h=cd+(x.label?`<span class="name">${esc(x.label)}</span>`:'');
  const split=x.layers.length>1;
  const st=x.layers.map((L,i)=>s?stockAt(slotKey(s,r,c,i)):[]);
  const anyItem=x.layers.some(L=>lines(L.t).length||(L.p||[]).length)||st.some(a=>a.length);
  if(!anyItem&&!split)return h; // 빈 칸은 칸 코드(와 이름)만 — 화면이 덜 복잡하게
  h+='<span class="layers">'+x.layers.map((L,i)=>{
    // 📌지정 제품(수량, 0이면 흐리게) → 그 밖의 재고 → 손으로 적은 메모. 한 줄에 하나
    const pp=L.p||[];
    const ls=pp.map(pr=>{const a=st[i].find(z=>z.id===pr.id);return `<span class="it pin">${esc(prodName(pr))} <b${a?'':' class="q0"'}>${fmtN(a?a.qty:0)}</b></span>`})
      .concat(st[i].filter(a=>!pp.some(pr=>pr.id===a.id)).map(a=>`<span class="it">${esc(a.name)} <b>${fmtN(a.qty)}</b></span>`),
              lines(L.t).map(t=>`<span class="it memo">${esc(t)}</span>`));
    const body=ls.length?ls.slice(0,4).join('')+(ls.length>4?`<span class="more">외 ${ls.length-4}개</span>`:''):'<i>–</i>';
    return `<span class="layer">${split?`<b class="ly">${i+1}층</b>`:''}${body}</span>`}).join('')+'</span>';
  return h;
}
function bigStyle(d,x){
  const n=x.rs*x.cs;if(n<=1)return;
  d.classList.add('big');
  const name=String(x.label||'').trim(),len=[...name].length,long=Math.max(x.rs,x.cs);
  const fs=(x.type==='label'?17:15)+Math.min(long,5)*1.6;
  const ls=len&&len<=6?Math.min(0.2+0.3*(long-1),1.4):0.02;
  d.style.setProperty('--fs',(fs/13.5).toFixed(2)+'em');
  d.style.setProperty('--ls',ls.toFixed(2)+'em');
  if(x.rs>x.cs&&len&&len<=6)d.classList.add('tall');
}
function renderGrid(){
  const s=sh(),g=E('grid'),q=query(),cov=covered(s);
  g.style.gridTemplateColumns=`repeat(${s.cols},minmax(var(--cw),1fr))`;g.innerHTML='';
  for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++){
    const k=K(r,c);if(cov[k])continue;const x=get(s,r,c);
    const d=document.createElement('button');
    d.className='cell '+x.type+(sel.has(k)||(MV&&MV.src&&MV.src.si===S.cur&&MV.src.r===r&&MV.src.c===c)?' sel src':'')+(q&&(matches(x,q)||stockMatch(s,r,c,q))?' hit':'')+(flashKey===k?' flash':'')+(cellHasStock(s,r,c)?' stocked':'');
    d.style.gridRow=`${r+1} / span ${x.rs}`;d.style.gridColumn=`${c+1} / span ${x.cs}`;d.dataset.k=k;
    d.setAttribute('aria-label',code(r,c)+(x.label?' '+x.label:''));
    d.innerHTML=cellHTML(x,r,c,s);bigStyle(d,x);d.onclick=()=>tap(r,c);g.appendChild(d);
  }
}
function renderMerge(){
  E('floor').classList.toggle('merging',mergeMode);E('bMerge').classList.toggle('on',mergeMode);
  E('mergeBar').hidden=!mergeMode;E('hint').hidden=mergeMode;
  E('mergeInfo').textContent=sel.size?`${sel.size}칸 선택됨 (선택한 칸을 감싸는 네모로 합쳐요)`:'합칠 칸을 차례로 누르세요';
}

/* ---------- 칸 ---------- */
function tap(r,c){const k=K(r,c);if(PIN){pickIn(r,c);return}if(MV){pickDest(r,c);return}if(mergeMode){sel.has(k)?sel.delete(k):sel.add(k);render();return}cur={r,c};openCell()}
function doMerge(){
  if(sel.size<2){toast('두 칸 이상 골라주세요');return}
  const s=sh();let r0=99,c0=99,r1=-1,c1=-1;
  sel.forEach(k=>{const[r,c]=k.split(',').map(Number);const x=get(s,r,c);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r+x.rs-1);c1=Math.max(c1,c+x.cs-1)});
  for(const k in s.cells){const x=s.cells[k];const[r,c]=k.split(',').map(Number);const er=r+x.rs-1,ec=c+x.cs-1;
    const hit=!(er<r0||r>r1||ec<c0||c>c1),inside=r>=r0&&c>=c0&&er<=r1&&ec<=c1;
    if(hit&&!inside){toast('이미 합친 칸이 범위 밖으로 걸쳐 있어요. 그 칸을 먼저 풀어주세요');return}}
  for(let i=r0;i<=r1;i++)for(let j=c0;j<=c1;j++)if((i!==r0||j!==c0)&&guard(cellHasStock(s,i,j),
    `${code(i,j)} 칸에 재고가 있어요. 재고를 옮긴 뒤 합쳐주세요`))return;
  const base=ensure(s,r0,c0),extra=[],extraP=[];
  for(let i=r0;i<=r1;i++)for(let j=c0;j<=c1;j++){if(i===r0&&j===c0)continue;const k=K(i,j),x=s.cells[k];if(!x)continue;
    if(x.type==='slot')x.layers.forEach(L=>{if(String(L.t).trim())extra.push(String(L.t).trim());if((L.p||[]).length)extraP.push(...L.p)});
    if(x.label&&!base.label)base.label=x.label;delete s.cells[k]}
  if(extra.length){if(base.type!=='slot')base.type='slot';base.layers[0].t=[String(base.layers[0].t).trim(),...extra].filter(Boolean).join('\n')}
  if(extraP.length){if(base.type!=='slot')base.type='slot';base.layers[0].p=uniqP((base.layers[0].p||[]).concat(extraP))}
  base.rs=r1-r0+1;base.cs=c1-c0+1;sel.clear();mergeMode=false;save();render();
  toast(`${code(r0,c0)} 기준으로 ${base.rs*base.cs}칸을 합쳤어요. 눌러서 이름을 적어보세요`);
}

/* ---------- 위치도 안에서 이동 ----------
   1) 품목 '이동' / '층 전체 이동' / '칸째로 이동' → 2) 받을 칸 누르기 (층이 나뉜 칸이면 층 고르기)
   3) 수량·담당자 확인 → 거래로그에 '이동' 기록(locMove). 직접 적은 메모는 원하면 같이 옮김 */
const layerText=(s,r,c,i)=>String((get(s,r,c).layers[i]||{}).t||'').trim();
const layerNote=(s,r,c,i)=>!!layerText(s,r,c,i)||((get(s,r,c).layers[i]||{}).p||[]).length>0; // 메모 또는 지정 제품
const layerMovable=(s,r,c,i)=>stockAt(slotKey(s,r,c,i)).length>0||layerNote(s,r,c,i);
/** 위치도 변경(newS = S 복사본에 적용)과 재고 이동(mv)을 한 번에 저장 — 둘 중 하나만 되는 일이 없게 */
function commit(newS,mv,done,fail){
  if(!GAS){const c=S.cur;S=newS;S.cur=c;save();done();return}
  if(dirty||saving){flush();toast('위치도를 저장 중이에요. 잠시 후 다시 눌러주세요');fail&&fail();return}
  clearTimeout(saveTimer);saving=true;setStatus('저장 중');
  GAS.withSuccessHandler(res=>{saving=false;
    if(res&&res.ok){const c=S.cur;S=newS;S.cur=c;version=res.version;if(res.stock){STK=res.stock;stockToHost()}setStatus('저장됨');mapToHost();done();if(dirty)flush();return}
    if(res&&res.conflict){const o=parse(res.data);if(o){const c=S.cur;S=o;S.cur=c;fixCur()}version=res.version;MV=null;closePanel();render();setStatus('저장됨');
      toast('다른 사람이 먼저 위치도를 고쳐서 아무것도 바꾸지 않았어요. 다시 해주세요');fail&&fail()}
  }).withFailureHandler(e=>{saving=false;setStatus('저장됨');toast((e&&e.message)||'저장하지 못했어요');loadStock();fail&&fail()})
    .locApply(JSON.stringify(newS),version,mv||null);
}
function startCellMove(s,r,c,layers){
  if(!layers.length)return;const x=get(s,r,c);
  startMove({label:code(r,c)+(x.label?' '+x.label:'')+(x.layers.length>1?' '+layers.map(i=>(i+1)+'층').join('·'):'')+' 전체',
    parts:layers.map(i=>({from:slotKey(s,r,c,i),layer:i,items:stockAt(slotKey(s,r,c,i)).slice()})),src:{si:S.cur,r,c}});
}
function startMove(m){if(GAS&&!stockLoaded&&m.parts.some(p=>p.items.length)){toast('재고 정보를 불러오는 중이에요');return}
  mergeMode=false;sel.clear();MV=m;closePanel();render();toast('받을 칸을 누르세요. 다른 시트 탭으로 가서 골라도 돼요')}

/** 서버가 돌려준 품목(위치별 수량 포함)으로 위치도 재고·품목 목록 갱신 */
function upsertItem(it){
  const x={id:it.id,name:String(it.name),cat:String(it.cat||'')};
  if(!ITEMMAP[x.id])ITEMS.push(x);else Object.assign(ITEMMAP[x.id],x);ITEMMAP[x.id]=ITEMMAP[x.id]||x;
  Object.keys(STK).forEach(k=>{STK[k]=STK[k].filter(a=>a.id!==x.id);if(!STK[k].length)delete STK[k]});
  Object.keys(it.locs||{}).forEach(k=>{const q=Number(it.locs[k])||0;if(q){(STK[k]=STK[k]||[]).push({id:x.id,name:x.name,cat:x.cat,qty:q});STK[k].sort((a,b)=>b.qty-a.qty)}});
}

/* ---------- 가운데 줄·칸 지우기: 빈 줄(칸)만, 뒤쪽 줄이 한 칸씩 당겨짐 (재고는 바뀐 칸 이름으로 '이동') ---------- */
function delPlan(axis,a){

  for(const k in s.cells){const x=s.cells[k],[r,c]=k.split(',').map(Number),st=axis==='r'?r:c,sp=axis==='r'?x.rs:x.cs;
    if(sp>1&&a>=st&&a<st+sp)return{err:`${code(r,c)} 합친 칸이 ${lineName(axis,a)}에 걸쳐 있어요. 먼저 "합친 칸 풀기"를 해주세요`};
    const at=axis==='r'?r===a:c===a;if(at&&(hasContent(x)||x.type==='label'))return{err:`${lineName(axis,a)}에 내용이 있어요 (${code(r,c)}). 먼저 비우거나 다른 자리로 옮겨주세요`}}
  for(let j=0;j<n;j++){const[r,c]=pos(a,j);if(!cov[K(r,c)]&&cellHasStock(s,r,c))return{err:`${code(r,c)} 칸에 재고가 있어요. 먼저 다른 칸으로 옮겨주세요`}}
  const groups=[];let neg=false;

    keysAt(s,r,c).forEach((k,i)=>{const list=stockAt(k);if(!list.length)return;if(list.some(z=>z.qty<0))neg=true;
      groups.push({fromLoc:k,toLoc:slotKey(s,r2,c2,i),moves:list.map(z=>({id:z.id,qty:z.qty}))})})}
  if(neg)return{err:'재고가 마이너스인 칸이 있어요. 재고앱에서 조정한 뒤 지워주세요'};
  const N=clone(S),ns=N.sheets[S.cur],cells={};
  for(const k in ns.cells){const[r,c]=k.split(',').map(Number),v=axis==='r'?r:c;if(v===a)continue;
    cells[v>a?(axis==='r'?K(r-1,c):K(r,c-1)):k]=ns.cells[k]}

}

/* ---------- 줄·칸 통째로 옮기기 (받는 줄에 내용이 있으면 서로 자리 바꾸기) ---------- */
let LN={axis:'r',a:0,b:1,mode:'move'};
const lineName=(axis,i)=>axis==='r'?rowCode(i)+'줄':(i+1)+'번 칸';
function linePlan(axis,a,b){
  const s=sh(),cov=covered(s),n=axis==='r'?s.cols:s.rows,pos=(line,j)=>axis==='r'?[line,j]:[j,line];
  for(const k in s.cells){const x=s.cells[k],[r,c]=k.split(',').map(Number);
    if(axis==='r'&&x.rs>1&&((a>=r&&a<r+x.rs)||(b>=r&&b<r+x.rs)))return{err:`${code(r,c)} 합친 칸이 여러 줄에 걸쳐 있어요. 먼저 "합친 칸 풀기"를 해주세요`};
    if(axis==='c'&&x.cs>1&&((a>=c&&a<c+x.cs)||(b>=c&&b<c+x.cs)))return{err:`${code(r,c)} 합친 칸이 여러 칸에 걸쳐 있어요. 먼저 "합친 칸 풀기"를 해주세요`}}
  const has=line=>{for(let j=0;j<n;j++){const[r,c]=pos(line,j);if(s.cells[K(r,c)]||(!cov[K(r,c)]&&cellHasStock(s,r,c)))return true}return false};
  const groups=[];let neg=false;
  const add=(from,to)=>{for(let j=0;j<n;j++){const[r,c]=pos(from,j),[r2,c2]=pos(to,j);if(cov[K(r,c)])continue;
    keysAt(s,r,c).forEach((k,i)=>{const list=stockAt(k);if(!list.length)return;if(list.some(z=>z.qty<0))neg=true;
      groups.push({fromLoc:k,toLoc:slotKey(s,r2,c2,i),moves:list.map(z=>({id:z.id,qty:z.qty}))})})}};
  const hasA=has(a),swap=has(b);
  add(a,b);if(swap)add(b,a);
  if(neg)return{err:'재고가 마이너스인 칸이 있어요. 재고앱에서 조정한 뒤 옮겨주세요'};
  const N=clone(S),ns=N.sheets[S.cur];
  for(let j=0;j<n;j++){const ka=K(...pos(a,j)),kb=K(...pos(b,j)),xa=ns.cells[ka],xb=ns.cells[kb];
    if(xb)ns.cells[ka]=xb;else delete ns.cells[ka];if(xa)ns.cells[kb]=xa;else delete ns.cells[kb]}
  return{hasA,swap,groups,N};
}
function openLine(){if(MV)endMove();mergeMode=false;sel.clear();render();drawLine();openPanel()}
function drawLine(){
  if(LN.mode==='del'){drawLineDel();return}
  const s=sh(),P=E('panelBody');P.dataset.kind='line';
  const n=LN.axis==='r'?s.rows:s.cols;LN.a=Math.min(LN.a,n-1);LN.b=Math.min(LN.b,n-1);
  const opts=v=>Array.from({length:n},(_,i)=>`<option value="${i}"${i===v?' selected':''}>${esc(lineName(LN.axis,i))}</option>`).join('');
  const pl=LN.a===LN.b?{err:'보낼 자리를 다르게 골라주세요'}:(GAS&&!stockLoaded)?{err:'재고 정보를 불러오는 중이에요'}:linePlan(LN.axis,LN.a,LN.b);
  const A=lineName(LN.axis,LN.a),B=lineName(LN.axis,LN.b),ok=!pl.err&&pl.hasA,st=lastStaff(),staff=STAFF.length?STAFF:[''];
  P.innerHTML=`<div class="ph"><h2>줄·칸 옮기기<small>${esc(s.name)}</small></h2><button class="x" data-a="close">닫기</button></div>
  <div class="seg"><button data-md="move" class="on">⇄ 옮기기</button><button data-md="del">🗑 지우기</button></div>
  <div class="seg"><button data-ax="r" class="${LN.axis==='r'?'on':''}">줄 (A·B·C…)</button><button data-ax="c" class="${LN.axis==='c'?'on':''}">칸 (1·2·3…)</button></div>
  <label class="f">옮길 ${LN.axis==='r'?'줄':'칸'}<select data-f="a">${opts(LN.a)}</select></label>
  <label class="f">보낼 자리<select data-f="b">${opts(LN.b)}</select></label>
  <p class="note"${pl.err?' style="color:#B3412E"':''}>${pl.err?esc(pl.err):!pl.hasA?esc(A)+'에는 옮길 내용이 없어요':
    `<b>${esc(A)}${pl.swap?' ↔ '+esc(B)+'</b> 자리를 서로 바꿔요 ('+esc(B)+'에도 내용이 있어요)':' → '+esc(B)+'</b>로 옮겨요'}. 칸 이름·메모·층·📌지정 제품이 같이 가요.`+
    (pl.groups.length?` 재고 ${pl.groups.length}곳도 같이 옮겨지고 재고앱 이력에 '이동'으로 남아요.`:'')}</p>
  ${ok&&pl.groups.length&&GAS?`<label class="f">담당자<select data-f="staff">${staff.map(v=>`<option${v===st?' selected':''}>${esc(v)}</option>`).join('')}</select></label>`:''}
  <div class="acts"><button data-a="go"${ok?'':' disabled'} style="background:var(--ink);color:var(--paper);font-weight:700">${pl.swap?'⇄ 자리 바꾸기':'⇄ 옮기기'}</button></div>`;
  P.querySelector('[data-a="close"]').onclick=closePanel;
  P.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{LN.mode=b.dataset.md;drawLine()});
  P.querySelectorAll('[data-ax]').forEach(b=>b.onclick=()=>{if(LN.axis===b.dataset.ax)return;LN={axis:b.dataset.ax,a:0,b:1,mode:LN.mode};drawLine()});
  P.querySelector('[data-f="a"]').onchange=e=>{LN.a=+e.target.value;drawLine()};
  P.querySelector('[data-f="b"]').onchange=e=>{LN.b=+e.target.value;drawLine()};
  P.querySelector('[data-a="go"]').onclick=e=>{if(!ok)return;const btn=e.target;
    if(pl.groups.length&&!GAS){toast('재고 이동은 재고앱의 위치도에서만 돼요');return}
    const ss=P.querySelector('[data-f="staff"]'),staffV=ss?ss.value:'';try{if(staffV)localStorage.setItem('subtek-staff',staffV)}catch(er){}
    btn.disabled=true;btn.textContent='저장 중…';
    commit(pl.N,pl.groups.length?{groups:pl.groups,staff:staffV,memo:A+(pl.swap?'↔':'→')+B}:null,()=>{closePanel();render();
      toast(pl.swap?`${A}와 ${B} 자리를 바꿨어요`:`${A}를 ${B}로 옮겼어요`)},()=>{btn.disabled=false;btn.textContent='⇄ 옮기기'})};
}

  });
}
/** 시트 이름 바꾸기 — 칸 재고는 새 위치 이름으로 '이동' 기록과 함께 옮김 */
function renameSheet(v,btn){
  const s=sh(),old=String(s.name||'').trim();v=String(v||'').trim();
  if(!v){toast('시트 이름을 입력하세요');return}
  if(v===old){toast('이름이 그대로예요');return}
  if(S.sheets.some(o=>o!==s&&String(o.name).trim()===v)){toast('같은 이름의 시트가 이미 있어요');return}
  if(GAS&&!stockLoaded){toast('재고 정보를 불러오는 중이에요. 잠시 후 다시 해주세요');return}
  const N=clone(S),ns=N.sheets[S.cur];ns.name=v;
  const ks=sheetKeys(s),groups=Object.keys(ks).filter(k=>stockAt(k).length).map(k=>{const[r,c,i]=ks[k];
    return{fromLoc:k,toLoc:slotKey(ns,r,c,i),moves:stockAt(k).filter(z=>z.qty>0).map(z=>({id:z.id,qty:z.qty}))}}).filter(g=>g.moves.length);
  btn.disabled=true;
  commit(N,groups.length?{groups,staff:lastStaff()||STAFF[0]||'',memo:'시트 이름 '+old+'→'+v}:null,()=>{drawSheet();render();
    toast(`이름을 "${v}"로 바꿨어요`+(groups.length?` (칸 재고 ${groups.length}곳 같이 이동)`:''))},()=>{btn.disabled=false});
}
/** 내용(이름·메모·지정 제품·이름표·합친 칸·재고)이 있는 마지막 줄·칸까지의 크기 */
function usedExtent(s){
  let mr=-1,mc=-1;
  for(const k in s.cells){const x=s.cells[k],[r,c]=k.split(',').map(Number);
    if(x.type==='label'||hasContent(x)||x.rs*x.cs>1){mr=Math.max(mr,r+x.rs-1);mc=Math.max(mc,c+x.cs-1)}}
  const ks=sheetKeys(s);Object.keys(ks).forEach(k=>{if(stockAt(k).length){const[r,c]=ks[k];mr=Math.max(mr,r);mc=Math.max(mc,c)}});
  return{rows:Math.max(1,mr+1),cols:Math.max(1,mc+1)};
}
function resize(dr,dc){
  const s=sh(),nr=Math.min(MAXR,Math.max(1,s.rows+dr)),nc=Math.min(MAXC,Math.max(1,s.cols+dc));
  if(nr===s.rows&&nc===s.cols){toast('줄과 칸은 1~'+MAXR+'까지 돼요');return}
  dr=nr-s.rows;dc=nc-s.cols;
  if(dr<0||dc<0){
    for(const k in s.cells){const[r,c]=k.split(',').map(Number);if((r>=nr||c>=nc)&&hasContent(s.cells[k])){toast('지울 자리에 내용이 있어요. 먼저 비워주세요');return}}
    for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++)if((r>=nr||c>=nc)&&guard(cellHasStock(s,r,c),`${code(r,c)} 칸에 재고가 있어요. 재고를 옮긴 뒤 줄여주세요`))return;
    for(const k in s.cells){const[r,c]=k.split(',').map(Number);const x=s.cells[k];
      if(r>=nr||c>=nc){delete s.cells[k];continue}x.rs=Math.min(x.rs,nr-r);x.cs=Math.min(x.cs,nc-c)}
  }
  s.rows=nr;s.cols=nc;save();renderGrid();drawSheet();
}

function openBackup(){
  const P=E('panelBody');P.dataset.kind='backup';
  P.innerHTML=`<div class="ph"><h2>가져오기·내보내기</h2><button class="x" data-a="close">닫기</button></div>
  <p class="note">${GAS?'평소엔 구글시트에 자동 저장돼요. Claude 미리보기에서 입력해 둔 내용이 있으면, 그쪽 백업 내용을 아래에 붙여넣고 불러오세요.':'이 화면은 이 기기에만 저장돼요. 복사해서 재고앱 위치도의 같은 메뉴에 붙여넣으면 옮겨져요.'}</p>
  <label class="f">위치도 데이터<textarea data-f="json" rows="8"></textarea></label>
  <div class="acts"><button data-a="copy">복사</button><button data-a="load">붙여넣은 내용 불러오기</button></div>`;
  const t=P.querySelector('[data-f="json"]');t.value=JSON.stringify(S);
  P.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
    if(a==='close'){closePanel();return}
    if(a==='copy'){try{await navigator.clipboard.writeText(t.value);toast('복사했어요')}catch(e){t.focus();t.select();toast('선택해 두었어요. 길게 눌러 복사하세요')}}
    if(a==='load'){const o=parse(t.value);if(!o){toast('형식이 맞지 않아요. 복사한 내용 전체를 붙여넣어 주세요');return}
      S=o;fixCur();save();closePanel();render();toast('불러왔어요')}
  });
  openPanel();
}

/* ---------- 검색 ---------- */
function renderResults(){
  const q=query(),box=E('results');renderGrid();if(!q){box.hidden=true;return}
  const out=[],norm=v=>String(v||'').replace(/\s+/g,'').toLowerCase(),nq=norm(q);
  // 1) 품목: 총수량 + 위치별 수량 (재고 또는 📌지정이 있는 품목)
  const ix=keyIndex(),cards=ITEMS.filter(it=>norm(it.name).includes(nq)).map(it=>itemInfo(it.id,ix)).filter(c=>c.rows.length).slice(0,8);
  // 2) 칸 이름·메모·📌지정(재고 0)
  S.sheets.forEach((s,si)=>{for(const k in s.cells){const x=s.cells[k];const[r,c]=k.split(',').map(Number);
    if(String(x.label||'').toLowerCase().includes(q))out.push({si,r,c,w:'',t:x.label});
    if(x.type==='slot')x.layers.forEach((L,i)=>lines(L.t).forEach(t=>{if(t.toLowerCase().includes(q))out.push({si,r,c,w:x.layers.length>1?(i+1)+'층':'',t})}))
    if(x.type==='slot')x.layers.forEach((L,i)=>(L.p||[]).forEach(pr=>{const nm=prodName(pr);
      if(nm.toLowerCase().includes(q)&&!stockAt(slotKey(s,r,c,i)).some(a=>a.id===pr.id))out.push({si,r,c,pid:pr.id,w:(x.layers.length>1?(i+1)+'층 ':'')+(x.label||''),t:'📌'+nm+' · 지정 (재고 0)'})}))}
  });
  // 재고가 있는 품목은 위 카드에 나오므로, 아래 칸 목록에서는 📌지정(재고 0)·이름·메모만
  const shown={};cards.forEach(c=>shown[c.id]=1);
  const rest=out.filter(o=>!(o.pid&&shown[o.pid]));
  // 같은 이름의 품목이 없으면: 새 품목으로 만들어 바로 입고
  const raw=E('q').value.trim(),exact=ITEMS.some(it=>norm(it.name)===nq);
  const newBtn=(GAS&&stockLoaded&&raw&&!exact)?`<button class="newin" data-newin="1">＋ "${esc(raw)}" 새 품목으로 만들어 입고</button>`:'';
  box.hidden=false;
  box.innerHTML=newBtn+(cards.length?'<p class="rsec">품목별 위치·수량</p>'+cards.map(itemCardHTML).join(''):'')+
    (rest.length?(cards.length?'<p class="rsec">이름·메모로 찾은 칸</p>':'')+rest.slice(0,40).map(o=>`<button data-n="${out.indexOf(o)}"><span class="rw">${esc(S.sheets[o.si].name)+' '+code(o.r,o.c)+' '+esc(o.w)}</span><span>${esc(o.t)}</span></button>`).join(''):'')||
    (newBtn?'':`<p class="none">"${esc(E('q').value.trim())}"이(가) 있는 칸이 없어요</p>`);
  box.querySelectorAll('[data-goloc]').forEach(b=>b.onclick=()=>{box.hidden=true;goLoc(b.dataset.goloc)});
  const nb=box.querySelector('[data-newin]');if(nb)nb.onclick=()=>{box.hidden=true;if(MV)MV=null;mergeMode=false;sel.clear();PIN={name:raw};render();toast('입고할 칸을 누르세요. 다른 시트 탭으로 가서 골라도 돼요')};
  box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const o=out[+b.dataset.n];box.hidden=true;flashCell(o.si,o.r,o.c)});
}
function flashCell(si,r,c){
  S.cur=si;flashKey=K(r,c);render();
  const el=root.querySelector(`.cell[data-k="${flashKey}"]`);if(el)el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
  setTimeout(()=>{flashKey=null},1500);
}

/* ---------- 자재별: 총수량 + 위치별 수량 ---------- */
/** 위치 이름 → 어디인지 {kind:'slot',si,r,c,i} / {kind:'loose',si} (시트 이름) / 없으면 연결 안 됨 */
function keyIndex(){const o={};S.sheets.forEach((s,si)=>{const ks=sheetKeys(s);Object.keys(ks).forEach(k=>{const[r,c,i]=ks[k];o[k]={kind:'slot',si,r,c,i}});
  const nm=String(s.name||'').trim();if(!o[nm])o[nm]={kind:'loose',si}});return o}
function locLabel(k,ix){const w=ix[k];if(!w)return k+' (연결 안 됨)';if(w.kind==='loose')return k+' (칸 미지정)';
  const s=S.sheets[w.si],x=get(s,w.r,w.c);return String(s.name).trim()+' '+code(w.r,w.c)+(x.label?' '+x.label:'')+(x.layers.length>1?' · '+(w.i+1)+'층':'')}
/** {id,name,cat,total,rows:[{k,label,qty,pin}]} — 재고 있는 곳(많은 순) + 📌지정했지만 재고 0인 칸 */
function itemInfo(id,ix){
  ix=ix||keyIndex();const it=ITEMMAP[id]||{id,name:id,cat:''},rows=[];let total=0;
  Object.keys(STK).forEach(k=>STK[k].forEach(a=>{if(a.id===id){total+=a.qty;rows.push({k,label:locLabel(k,ix),qty:a.qty})}}));
  rows.sort((a,b)=>b.qty-a.qty);
  S.sheets.forEach(s=>Object.keys(s.cells).forEach(ck=>{const x=s.cells[ck];if(x.type!=='slot')return;const[r,c]=ck.split(',').map(Number);
    x.layers.forEach((L,i)=>{if((L.p||[]).some(pr=>pr.id===id)){const k=slotKey(s,r,c,i),row=rows.find(z=>z.k===k);
      if(row)row.pin=1;else rows.push({k,label:locLabel(k,ix),qty:0,pin:1})}})}));
  return{id,name:it.name,cat:it.cat||'',total,rows};
}
function itemCardHTML(c){return `<div class="icard"><div class="ih"><b>${esc(c.name)}</b>${c.cat?`<small>${esc(c.cat)}</small>`:''}<span class="tot">총 ${fmtN(c.total)}개</span></div>`+
  c.rows.map(w=>`<button class="lr${w.qty?'':' z'}" data-goloc="${esc(w.k)}"><span>${w.pin?'📌 ':''}${esc(w.label)}</span><b>${fmtN(w.qty)}</b></button>`).join('')+'</div>'}
/** 위치 이름으로 이동: 칸이면 반짝, 칸 미지정이면 그 목록, 연결 안 되면 그 목록 */
function goLoc(k){const w=keyIndex()[k];closePanel();
  if(!w){openOrphans();return}
  if(w.kind==='loose'){S.cur=w.si;render();openLoose();return}
  flashCell(w.si,w.r,w.c)}
function openItem(id){
  const c=itemInfo(id),P=E('panelBody');P.dataset.kind='item';P.dataset.id=id;
  P.innerHTML=`<div class="ph"><h2>${esc(c.name)}<small>${esc(c.cat)}</small></h2><button class="x" data-a="close">닫기</button></div>
  <div class="icard" style="padding:0;border:0"><div class="ih"><span>위치 ${c.rows.filter(w=>w.qty).length}곳</span><span class="tot" style="font-size:18px">총 ${fmtN(c.total)}개</span></div>
  ${c.rows.map(w=>`<button class="lr${w.qty?'':' z'}" data-goloc="${esc(w.k)}"><span>${w.pin?'📌 ':''}${esc(w.label)}</span><b>${fmtN(w.qty)}</b></button>`).join('')||'<p class="none">재고 없음</p>'}</div>
  <div class="acts" style="margin-top:12px"><button data-a="io">재고앱에서 입출고</button></div>`;
  P.querySelector('[data-a="close"]').onclick=closePanel;
  P.querySelector('[data-a="io"]').onclick=()=>openApp({item:id});
  P.querySelectorAll('[data-goloc]').forEach(b=>b.onclick=()=>goLoc(b.dataset.goloc));
  openPanel();
}
E('q').oninput=renderResults;
E('q').onfocus=()=>{if(query())renderResults()};
document.addEventListener('click',e=>{if(!e.target.closest('#locApp .search'))E('results').hidden=true});

/* ---------- 버튼 ---------- */
E('bMerge').onclick=()=>{if(MV)endMove();mergeMode=!mergeMode;sel.clear();render()};
E('bMvCancel').onclick=()=>endMove();
E('bCancel').onclick=()=>{mergeMode=false;sel.clear();render()};
E('bDoMerge').onclick=doMerge;
E('bSheet').onclick=openSheet;
E('bBackup').onclick=openBackup;
E('bLine').onclick=openLine;
/* 칸 크기(글자 크기) — 이 기기에 기억 */
const ZOOM=[{cw:64,ch:56,fz:11},{cw:96,ch:78,fz:13.5},{cw:124,ch:96,fz:15.5},{cw:156,ch:118,fz:18}];
let zoom=1;try{const z=+localStorage.getItem('subtek-loc-zoom');if(z>=0&&z<ZOOM.length&&localStorage.getItem('subtek-loc-zoom')!==null)zoom=z}catch(e){}
function applyZoom(){const z=ZOOM[zoom];root.style.setProperty('--cw',z.cw+'px');root.style.setProperty('--ch',z.ch+'px');root.style.setProperty('--fz',z.fz+'px');
  E('zOut').disabled=zoom===0;E('zIn').disabled=zoom===ZOOM.length-1;try{localStorage.setItem('subtek-loc-zoom',zoom)}catch(e){}}
E('zOut').onclick=()=>{if(zoom>0){zoom--;applyZoom()}};E('zIn').onclick=()=>{if(zoom<ZOOM.length-1){zoom++;applyZoom()}};
applyZoom();
if(GAS&&root.classList.contains('solo')){
  const bk=E('back');bk.hidden=false;
  bk.onclick=()=>{if(APP){openApp({});return}GAS.withSuccessHandler(u=>window.open(u,'_top')).locUrl()};
}

/* ---------- 시작 ---------- */
/* 재고앱에서 "위치도에서 보기"로 왔으면 ?q=품명 으로 바로 검색 */
function applyPendingQ(){if(!pendingQ||!S)return;E('q').value=pendingQ;pendingQ='';renderResults()}
/* ---------- 재고앱과 주고받기 ---------- */
/** 위치도 → 보관칸 목록 (Location.gs 의 locSlotsForApp_ 와 같은 결과) */
function appSlots(){const sheets=[],slots=[];S.sheets.forEach(s=>{const sheet=String(s.name||'').trim();if(!sheet)return;sheets.push(sheet);
  Object.keys(s.cells||{}).map(k=>k.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).forEach(([r,c])=>{const x=s.cells[K(r,c)];if(!x||x.type!=='slot')return;
    const n=Math.max(1,(x.layers||[]).length);for(let i=0;i<n;i++){const L=(x.layers||[])[i]||{};
      slots.push({key:slotKey(s,r,c,i),sheet,code:code(r,c),label:String(x.label||'').trim(),layer:i,n,p:(L.p||[]).map(pr=>pr.id),
        note:((L.p||[])[0]||{}).name||lines(L.t)[0]||''})}})});return{sheets,slots}}
function mapToHost(){if(host()&&S)host().mapChanged(appSlots())}
function stockToHost(){if(host())host().stockChanged(STK)}
if(HOSTED){
  setStatus('불러오는 중');
  window.locApi={
    /** 위치도 데이터 {version, data} */
    init(loc){const o=loc&&loc.data?parse(loc.data):null;version=(loc&&loc.version)||0;const c=S?S.cur:0;
      if(o){S=o;S.cur=c;fixCur();setStatus('저장됨')}else if(!S){S=seed();save()}render();applyPendingQ()},
    /** 재고앱의 품목 목록(items[].locs)으로 위치별 재고를 만듦 — 서버에 다시 묻지 않음 */
    setStock(items,staff){STK={};ITEMS=[];ITEMMAP={};(items||[]).forEach(it=>{const x={id:it.id,name:String(it.name),cat:String(it.cat||'')};ITEMS.push(x);ITEMMAP[x.id]=x;
        Object.keys(it.locs||{}).forEach(k=>{const q=Number(it.locs[k])||0;if(q)(STK[k]=STK[k]||[]).push({id:x.id,name:x.name,cat:x.cat,qty:q})})});
      Object.keys(STK).forEach(k=>STK[k].sort((a,b)=>b.qty-a.qty));if(staff&&staff.length)STAFF=staff;stockLoaded=true;
      if(S){renderGrid();renderStockBar();if(query())renderResults()}},
    search(q){pendingQ=q||'';applyPendingQ()},
    /** 저장 안 된 변경이나 열린 창이 있으면 true (그동안은 새로 덮어쓰지 않음) */
    busy(){return dirty||saving||!!MV||!E('panel').hidden},
    slots:()=>S?appSlots():null
  };
}
else if(GAS){loadServer(false);loadStock();
  try{google.script.url.getLocation(l=>{const q=l&&l.parameter&&l.parameter.q;if(q){pendingQ=q;applyPendingQ()}})}catch(e){}}
else{try{const v=localStorage.getItem(KEY);S=v?parse(v):null}catch(e){}if(!S)S=seed();fixCur();render()}
})();
</script>
